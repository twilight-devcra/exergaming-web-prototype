# main 이나 dev 에 올리면 GitHub Pages 에 배포한다. 한 저장소에는 사이트가 하나뿐이라, 올릴 때마다 두 가지를 함께 만든다:
#   main → https://twilight-devcra.github.io/exergaming-web-prototype/      (운영, 체육관 태블릿)
#   dev  → https://twilight-devcra.github.io/exergaming-web-prototype/dev/  (시험·다른 기기에서 미리 보기)
# 배포본의 app/index.html 에만 ?v=<커밋 번호> 와 가져오기 지도를 넣는다 (tools/stamp.js). 저장소의 파일은 바뀌지 않는다.
# 저장소 Settings → Pages → Source 가 'GitHub Actions' 여야 하고,
# Settings → Environments → github-pages 의 배포 허용 브랜치에 main 과 dev 가 있어야 한다.
name: Deploy to Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      # dev 브랜치가 없으면 건너뛴다 (main 만 배포)
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: dev
          path: dev-src
      - name: Stamp each branch with its commit and put dev under /dev/
        run: |
          node site/tools/stamp.js "$(git -C site rev-parse --short=8 HEAD)"
          rm -rf site/.git
          if [ -f dev-src/tools/stamp.js ]; then
            node dev-src/tools/stamp.js "dev$(git -C dev-src rev-parse --short=8 HEAD)"
            rm -rf dev-src/.git dev-src/.github
            mv dev-src site/dev
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
