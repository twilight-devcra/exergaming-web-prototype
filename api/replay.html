<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엑서게임 세션 재생</title>
<!-- 세션 하나를 다시 본다: 페달 타임라인 + 문제마다 판을 세션 로그에서 다시 그린다. 관리 화면 최근 세션의 '재생' 에서 연다.
     주소: /admin/replay?env=<env>&device=<device>&sid=<id>  → /admin/raw/... 의 원본(.json.gz)을 받아 푼다.
     게임 그림은 DRAW 에 게임마다 하나. 그림이 없는 게임은 기록된 문제 내용을 글로 보여 준다. 형식은 docs/SESSION_LOG.md -->
<style>
  /* 관리 화면(admin.html)과 같은 색·글꼴. 요약 칸 → 타임라인 → 판 + 문제 목록 */
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --sunk: #f1f0ec; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
    --series: #2a78d6; --zone: rgba(31,157,85,0.14); --zone-edge: rgba(31,157,85,0.45);
    --good: #1f8a4c; --bad: #c8372f; --late: #a66a00; --on-strong: #ffffff; --hollow-in: #fcfcfb;
    --g1: #2a78d6; --g2: #c2569b; --g3: #1f9d8a; --g4: #d98a1c; --g5: #7a5cc7; --g6: #5f7d3a;
    --font: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Consolas, "D2Coding", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --sunk: #232321; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #45453f; --border: rgba(255,255,255,0.10);
      --series: #5a9ff0; --zone: rgba(60,190,110,0.16); --zone-edge: rgba(60,190,110,0.5);
      --good: #47c27a; --bad: #ec6a62; --late: #e0a33a; --on-strong: #0b0b0b; --hollow-in: #1a1a19;
      --g1: #5a9ff0; --g2: #e07fbd; --g3: #3cc4ae; --g4: #eba54a; --g5: #a28aeb; --g6: #8fb35f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --sunk: #232321; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #45453f; --border: rgba(255,255,255,0.10);
    --series: #5a9ff0; --zone: rgba(60,190,110,0.16); --zone-edge: rgba(60,190,110,0.5);
    --good: #47c27a; --bad: #ec6a62; --late: #e0a33a; --on-strong: #0b0b0b; --hollow-in: #1a1a19;
    --g1: #5a9ff0; --g2: #e07fbd; --g3: #3cc4ae; --g4: #eba54a; --g5: #a28aeb; --g6: #8fb35f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 var(--font); }
  main { max-width: 1200px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 20px; margin: 0; text-wrap: balance; }
  h2 { font-size: 15px; margin: 0; }
  .head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; justify-content: space-between; }
  .sub { color: var(--ink-2); margin: 4px 0 0; }
  .back { color: var(--series); font-size: 13px; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .tag { display: inline-block; font-size: 11px; letter-spacing: 0.04em; color: var(--late); border: 1px solid currentColor; border-radius: 4px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; }
  .open { display: flex; gap: 8px; align-items: center; color: var(--ink-2); font-size: 12px; }
  .open label { cursor: pointer; color: var(--series); border: 1px solid var(--axis); background: var(--surface); border-radius: 6px; padding: 5px 10px; font-size: 13px; }
  .open label:focus-within { outline: 2px solid var(--series); outline-offset: 2px; }
  .open input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-top: 16px; min-width: 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tile .k { color: var(--ink-2); font-size: 12px; }
  .tile .v { font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .v small { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
  .tile .x { font-size: 12px; color: var(--ink-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .bar-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .controls { display: flex; gap: 8px; align-items: center; }
  button, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:focus-visible, select:focus-visible, .q-row:focus-visible, svg.tl:focus-visible { outline: 2px solid var(--series); outline-offset: 2px; }
  #play { min-width: 74px; }
  .clock { font: 600 15px/1 var(--mono); font-variant-numeric: tabular-nums; min-width: 92px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--ink-2); font-size: 12px; }
  .legend i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
  .tl-wrap { overflow-x: auto; }
  svg.tl { display: block; width: 100%; min-width: 640px; height: auto; touch-action: none; cursor: col-resize; user-select: none; }
  .tl .lbl { fill: var(--muted); font-size: 11px; }
  .tl .lbl-ink { fill: var(--ink-2); font-size: 11px; }
  .tl .band-lbl { fill: var(--on-strong); font-size: 11px; font-weight: 600; }
  .stage { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .stage > section { margin-top: 0; }
  .wrap-stage { margin-top: 16px; }
  .card-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; justify-content: space-between; }
  .meta { color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
  .chip { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; color: var(--on-strong); }
  .chip.good { background: var(--good); } .chip.bad { background: var(--bad); } .chip.late { background: var(--late); } .chip.wait { background: var(--axis); color: var(--ink); }
  .board { margin-top: 12px; background: var(--sunk); border-radius: 8px; padding: 14px; display: flex; justify-content: center; min-height: 260px; align-items: center; }
  .board svg { display: block; max-width: 100%; height: auto; max-height: 340px; }
  .board .empty { color: var(--muted); text-align: center; }
  .board pre { font: 11px/1.4 var(--mono); color: var(--ink-2); white-space: pre-wrap; word-break: break-all; margin: 8px 0 0; text-align: left; max-height: 220px; overflow: auto; }
  .b-ink { fill: var(--ink); } .b-ink2 { fill: var(--ink-2); } .b-mut { fill: var(--muted); } .b-surf { fill: var(--surface); } .b-grid { fill: var(--grid); }
  .s-ink { stroke: var(--ink); } .s-axis { stroke: var(--axis); } .s-good { stroke: var(--good); } .s-bad { stroke: var(--bad); } .s-series { stroke: var(--series); }
  .f-good { fill: var(--good); } .f-bad { fill: var(--bad); } .f-series { fill: var(--series); } .f-on { fill: var(--on-strong); }
  .board text { font-family: var(--font); }
  /* HTML 로 그리는 판 (지시 따르기 · 상자 속 과일) */
  .rp-col { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 100%; }
  .rp-text { margin: 0; font-size: 15px; font-weight: 600; text-align: center; text-wrap: balance; max-width: 480px; }
  .rp-note { margin: 0; font-size: 12px; color: var(--ink-2); text-align: center; }
  .rp-mut { color: var(--muted); }
  .rp-ico { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; }
  .rp-fruit { font-size: 18px; line-height: 1; }
  .rp-steps { width: auto; font-size: 13px; }
  .rp-steps th, .rp-steps td { text-align: left; white-space: normal; padding: 5px 10px; position: static; background: none; }
  .rp-steps th { color: var(--muted); font-weight: 500; }
  .rp-opts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .rp-opt { min-width: 44px; padding: 6px 10px; text-align: center; font-weight: 600; background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; }
  .rp-opt.good { border: 3px solid var(--good); } .rp-opt.bad { border: 3px solid var(--bad); } .rp-opt.right { border: 2px dashed var(--good); }
  .think { margin-top: 14px; }
  .think .k { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .think svg { display: block; width: 100%; height: 34px; }
  .think .lbl { fill: var(--ink-2); font-size: 10px; }
  .q-list { max-height: 560px; overflow: auto; margin: 10px -16px -16px; border-top: 1px solid var(--grid); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { color: var(--ink-2); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--surface); }
  th:nth-child(-n+2), td:nth-child(-n+2) { text-align: left; }
  .q-row { cursor: pointer; }
  .q-row:hover { background: var(--sunk); }
  .q-row.cur { background: var(--sunk); box-shadow: inset 3px 0 0 var(--series); }
  .q-row .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .dot.good { background: var(--good); } .dot.bad { background: var(--bad); } .dot.late { background: var(--late); }
  .note { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .err { color: var(--bad); font-size: 13px; }
  @media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } .q-list { max-height: 360px; } }
  @media (max-width: 600px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .tile .v { font-size: 19px; } section { padding: 12px; } .q-list { margin: 10px -12px -12px; } }
</style>
</head>
<body>
<main>
  <div class="head">
    <div>
      <a class="back" id="back" href="./">← 관리 화면</a>
      <h1>세션 재생</h1>
      <p class="sub" id="sess-meta">관리 화면 최근 세션의 '재생' 으로 열거나, 세션 파일을 여세요.</p>
    </div>
    <div class="open">
      <span id="open-msg">관리 화면의 원본(.json.gz) 또는 내보낸 .json · .jsonl</span>
      <label>세션 파일 열기<input type="file" id="file" accept=".json,.jsonl,.gz,application/json,application/gzip"></label>
    </div>
  </div>

  <div class="tiles" id="tiles"></div>

  <section id="tl-sec" hidden>
    <div class="bar-row">
      <div class="controls">
        <button id="play" type="button">▶ 재생</button>
        <select id="speed" aria-label="재생 속도">
          <option value="1">1×</option><option value="4" selected>4×</option><option value="10">10×</option>
        </select>
        <span class="clock" id="clock">0:00.0</span>
      </div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="tl-wrap"><svg class="tl" id="tl" tabindex="0" aria-label="세션 타임라인. 좌우 화살표로 이동"></svg></div>
    <p class="note">시각은 게임 시계(일시정지 동안 멈춤)입니다. 타임라인을 누르거나 끌어서 옮기고, 아래 목록에서 문제를 고를 수 있어요.</p>
  </section>

  <div class="stage wrap-stage" id="stage" hidden>
    <section aria-live="polite">
      <div class="card-head">
        <h2 id="b-title">–</h2>
        <span id="b-chip"></span>
      </div>
      <div class="meta" id="b-meta"></div>
      <div class="board" id="board"></div>
      <div class="think" id="think"></div>
    </section>
    <section>
      <div class="card-head"><h2>문제</h2><span class="meta" id="q-count"></span></div>
      <div class="q-list"><table><thead><tr><th>#</th><th>게임</th><th>Lv</th><th>결과</th><th>첫 입력</th><th>답까지</th></tr></thead><tbody id="q-body"></tbody></table></div>
    </section>
  </div>
</main>

<script>
(() => {
  const $ = (selector) => document.querySelector(selector);
  const escapeHtml = (text) => String(text).replace(/[&<>"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[char]);
  // 서버가 /admin/api/options 로 모든 게임 이름을 주면 덮어쓴다
  const TITLES = {
    path: '길 따라 그리기', symbol: '심볼 위치 외우기', arith: '사칙연산 역산', count: '우세한 색 찾기', fit: '빈자리 채우기',
    seek: '숨은 순서 찾기', cover: '가린 숫자 더하기', ladder: '사다리 타기', pipe: '배관 타기', novel: '없던 그림 찾기', track: '공 따라가기',
    follow: '지시 따르기', pair: '짝 없는 것 찾기', box: '상자 속 과일 세기', compare: '두 그림 비교하기', coin: '동전 세기',
    recall: '차례대로 외우기', chain: '조각 잇기', blank: '같은 글자 넣기', safe: '금고 열기', art: '그림 조각 기억하기',
  };
  const clockText = (milliseconds, tenths = true) => {
    if (milliseconds == null || !isFinite(milliseconds)) return '–';
    const totalSeconds = Math.max(0, milliseconds) / 1000, minutes = Math.floor(totalSeconds / 60), remainder = totalSeconds - minutes * 60;
    return `${minutes}:${(tenths ? remainder.toFixed(1) : Math.floor(remainder).toString()).padStart(tenths ? 4 : 2, '0')}`;
  };
  const seconds = (milliseconds) => (milliseconds == null ? '–' : `${(milliseconds / 1000).toFixed(1)}초`);

  // ---------- 세션 → 재생용 모델 ----------
  function buildModel(log) {
    const events = log.events || [];
    const end = events.length ? events[events.length - 1].clock : 0;
    const games = [], questions = [], pauses = [];
    let round = null, question = null, pauseAt = null;
    for (const event of events) {
      if (event.type === 'game_start') { round = { game: event.game, level: event.level, start: event.clock, open: null, end: end, questions: [] }; games.push(round); }
      else if (event.type === 'intro_end' && round) round.open = event.clock;
      else if ((event.type === 'game_end' || event.type === 'game_abort') && round) { round.end = event.clock; round.aborted = event.type === 'game_abort'; round = null; }
      // 문제 번호는 1씩 늘어난다. 로그 버전 5 까지는 상자 속 과일의 문제 내용(q)이 번호를 덮어써서, 그때는 앞 번호 + 1 로 메운다
      else if (event.type === 'question') {
        const number = Number.isInteger(event.q) ? event.q : (questions.length ? questions[questions.length - 1].number : 0) + 1;
        question = { number, game: event.game, level: event.level, shownAt: event.clock, open: event.clock, data: event, inputs: [], answer: null, limit: null, round };
        questions.push(question);
        if (round) round.questions.push(question);
      }
      else if (event.type === 'input_open' && question && question.number === event.q) question.open = event.clock;
      else if (event.type === 'timer_start' && question && !question.answer && question.limit == null) question.limit = event.limitMs;
      else if (event.type === 'input' && question && question.number === event.q) question.inputs.push(event);
      else if (event.type === 'answer' && question && question.number === event.q) {
        question.answer = event;
        if (!('first' in event)) event.first = question.inputs.length ? question.inputs[0].ms : event.timedOut ? null : event.ms;
      }
      else if (event.type === 'pause') pauseAt = event.clock;
      else if (event.type === 'resume' && pauseAt != null) { pauses.push([pauseAt, event.clock]); pauseAt = null; }
    }
    const order = [];
    for (const played of games) if (!order.includes(played.game)) order.push(played.game);
    const samples = (log.samples || []).map((sample) => ({ clock: sample[1], rpm: sample[2], target: sample[3], inZone: sample[5], score: sample[6] }));
    return { log, end, games, questions, order, samples, pauses, brain: !!(log.meta && log.meta.track === 'brain'), tolerance: (log.meta && log.meta.config && log.meta.config.tolerance) || 0.12,
      playStart: (events.find((event) => event.type === 'play_start') || {}).clock ?? 0 };
  }
  const resultOf = (question) => !question.answer ? 'wait' : question.answer.timedOut ? 'late' : question.answer.correct ? 'good' : 'bad';
  const RESULT = { good: '정답', bad: '오답', late: '시간 초과', wait: '푸는 중' };
  const gameColor = (id) => `var(--g${(model.order.indexOf(id) % 6) + 1})`;

  // ---------- 그림 도우미 ----------
  const SHAPES = {
    circle: (x, y, radius) => `<circle cx="${x}" cy="${y}" r="${radius * 0.85}"/>`,
    square: (x, y, radius) => `<rect x="${x - radius * 0.78}" y="${y - radius * 0.78}" width="${radius * 1.56}" height="${radius * 1.56}" rx="${radius * 0.15}"/>`,
    triangle: (x, y, radius) => `<polygon points="${x},${y - radius} ${x + radius * 0.95},${y + radius * 0.75} ${x - radius * 0.95},${y + radius * 0.75}"/>`,
    diamond: (x, y, radius) => `<polygon points="${x},${y - radius} ${x + radius},${y} ${x},${y + radius} ${x - radius},${y}"/>`,
    plus: (x, y, radius) => {
      const arm = radius * 0.32;
      return `<path d="M${x - arm} ${y - radius}h${2 * arm}v${radius - arm}h${radius - arm}v${2 * arm}h${-(radius - arm)}v${radius - arm}h${-2 * arm}v${-(radius - arm)}h${-(radius - arm)}v${-2 * arm}h${radius - arm}z"/>`;
    },
    star: (x, y, radius) => {
      let points = '';
      for (let i = 0; i < 10; i++) {
        const angle = -Math.PI / 2 + i * Math.PI / 5, pointRadius = i % 2 ? radius * 0.45 : radius;
        points += `${(x + pointRadius * Math.cos(angle)).toFixed(1)},${(y + pointRadius * Math.sin(angle)).toFixed(1)} `;
      }
      return `<polygon points="${points}"/>`;
    },
    // 심볼 위치 외우기의 초승달 (100×100 판의 M64 6 A45 45 0 1 0 94 72 A37 37 0 1 1 64 6 Z 를 반지름 radius 로 줄인 것)
    moon: (x, y, radius) => {
      const point = (px, py) => `${(x + ((px - 50) / 45) * radius).toFixed(1)} ${(y + ((py - 50) / 45) * radius).toFixed(1)}`;
      return `<path d="M${point(64, 6)} A${radius} ${radius} 0 1 0 ${point(94, 72)} A${(radius * 37) / 45} ${(radius * 37) / 45} 0 1 1 ${point(64, 6)} Z"/>`;
    },
    heart: (x, y, radius) => `<path d="M${x} ${y + radius * 0.85} C${x - radius * 1.3} ${y - radius * 0.1} ${x - radius * 0.6} ${y - radius * 1.1} ${x} ${y - radius * 0.35} C${x + radius * 0.6} ${y - radius * 1.1} ${x + radius * 1.3} ${y - radius * 0.1} ${x} ${y + radius * 0.85}z"/>`,
  };
  const SEEK_GLYPHS = ['circle', 'triangle', 'square', 'diamond', 'star', 'plus', 'heart', 'moon'];
  const COUNT_COLORS = { red: '#e5484d', blue: '#2f6fed', green: '#1f9d55', yellow: '#f5b301', purple: '#8e4ec6' };
  const COUNT_GLYPH = { red: 'circle', blue: 'square', green: 'triangle', yellow: 'diamond', purple: 'plus' };
  const svg = (width, height, body, label) => `<svg viewBox="0 0 ${width} ${height}" width="${width}" role="img" aria-label="${escapeHtml(label)}">${body}</svg>`;
  const badge = (x, y, label, className = 'f-series') => `<circle cx="${x}" cy="${y}" r="9" class="${className}"/><text x="${x}" y="${y + 3.5}" text-anchor="middle" font-size="10" font-weight="700" class="f-on">${label}</text>`;
  // 심볼 위치 외우기의 그림 id (SYMBOLS) 와 조각 잇기의 tee. 모르는 id 는 동그라미
  const glyph = (id, x, y, radius) => (id === 'tee'
    ? `<path d="M${x - radius} ${y - radius}h${2 * radius}v${radius * 0.7}h${-radius * 0.6}v${radius * 1.3}h${-radius * 0.8}v${-radius * 1.3}h${-radius * 0.6}z"/>`
    : (SHAPES[id] || SHAPES.circle)(x, y, radius));
  // 고른 칸·보기의 테두리. 답한 뒤: 고른 것은 맞으면 초록 · 틀리면 빨강 실선, 고르지 않은 정답은 초록 점선
  const pickRing = (x, y, width, height, answer, picked, right) => {
    if (!answer || (!picked && !right)) return '';
    return `<rect x="${x - 2}" y="${y - 2}" width="${width + 4}" height="${height + 4}" rx="9" fill="none" class="${picked ? (right ? 's-good' : 's-bad') : 's-good'}" stroke-width="${picked ? 3 : 2}" ${picked ? '' : 'stroke-dasharray="4 3"'}/>`;
  };
  // 수·글자 보기 한 줄 (판 가운데 정렬). 판 너비는 optionRowWidth 보다 작지 않게 잡는다
  const optionRowWidth = (count) => count * 60 + 8;
  const optionRow = (values, width, top, { right, answer, unit = '' }) => {
    const optionWidth = 52, gap = 8, left = (width - (values.length * (optionWidth + gap) - gap)) / 2;
    return values.map((value, i) => {
      const x = left + i * (optionWidth + gap), picked = answer && answer.picked === value, isRight = value === right;
      return `<rect x="${x}" y="${top}" width="${optionWidth}" height="34" rx="8" class="b-surf s-axis" stroke-width="1"/>` +
        `<text x="${x + optionWidth / 2}" y="${top + 22}" text-anchor="middle" font-size="15" font-weight="600" class="${answer && isRight ? 'b-ink' : 'b-ink2'}">${escapeHtml(value)}${unit}</text>` +
        pickRing(x, top, optionWidth, 34, answer, picked, isRight);
    }).join('');
  };
  // HTML 판(지시 따르기 · 상자 속 과일)의 보기
  const optionChips = (values, { right, answer, label }) => `<div class="rp-opts">${values.map((value) => {
    const picked = answer && answer.picked === value, isRight = value === right;
    return `<span class="rp-opt${answer && picked ? (isRight ? ' good' : ' bad') : answer && isRight ? ' right' : ''}">${label(value)}</span>`;
  }).join('')}</div>`;

  // 빈자리 채우기: 꼭짓점이 위인 육각형. 변 edge 의 바깥 방향은 -60° + 60°·edge (시계 방향). 모양 문자열은 docs/SESSION_LOG.md
  const FIT_COLORS = ['#e5484d', '#f5b301', '#2f6fed'];
  function fitHex(centerX, centerY, size, code, turns, isGap) {
    const edges = String(code).split('/').map((edge) => [...edge].map(Number));
    const corners = Array.from({ length: 6 }, (_, corner) => { const angle = ((-90 + 60 * corner) * Math.PI) / 180; return `${(centerX + size * Math.cos(angle)).toFixed(1)},${(centerY + size * Math.sin(angle)).toFixed(1)}`; }).join(' ');
    const apothem = (size * Math.sqrt(3)) / 2;
    const port = (edge, j) => {
      const angle = ((-60 + 60 * edge) * Math.PI) / 180, normalX = Math.cos(angle), normalY = Math.sin(angle);
      const offset = edges[edge].length < 2 ? 0 : (j === 0 ? -1 : 1) * size * 0.2;
      return [centerX + apothem * normalX - normalY * offset, centerY + apothem * normalY + normalX * offset, normalX, normalY];
    };
    let out = `<g transform="rotate(${turns * 60} ${centerX} ${centerY})"><polygon points="${corners}" class="${isGap ? 'b-grid' : 'b-surf'} s-axis" stroke-width="1.5" ${isGap ? 'stroke-dasharray="5 4"' : ''}/>`;
    const ends = {};
    edges.forEach((colors, edge) => colors.forEach((color, j) => (ends[color] ||= []).push(port(edge, j))));
    for (const [color, points] of Object.entries(ends)) {
      const stroke = `stroke="${FIT_COLORS[color] || 'var(--ink)'}" stroke-width="${size * 0.14}" stroke-linecap="round" fill="none"`;
      if (isGap) { for (const [x, y, normalX, normalY] of points) out += `<line x1="${x}" y1="${y}" x2="${x - normalX * size * 0.3}" y2="${y - normalY * size * 0.3}" ${stroke}/>`; continue; }
      const [[x1, y1], [x2, y2] = [centerX, centerY]] = points;
      out += `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} Q${centerX} ${centerY} ${x2.toFixed(1)} ${y2.toFixed(1)}" ${stroke}/>`;
    }
    return out + '</g>';
  }

  // 가린 숫자 더하기의 상자 표시 색
  const MARK_COLORS = { ...COUNT_COLORS, cyan: '#06aed5' };

  // 없던 그림 찾기의 그림 (js/games/novel.js 의 NOVEL_SHAPES · NOVEL_MARKS 와 같다, 100×100)
  const novelPolygon = (sides, radius, centerY, inner = 0) => Array.from({ length: inner ? sides * 2 : sides }, (_, i) => {
    const angle = ((-90 + (360 / (inner ? sides * 2 : sides)) * i) * Math.PI) / 180, r = inner && i % 2 ? inner : radius;
    return `${(50 + Math.cos(angle) * r).toFixed(1)},${(centerY + Math.sin(angle) * r).toFixed(1)}`;
  }).join(' ');
  const NOVEL_SHAPES = {
    circle: [50, '<circle cx="50" cy="50" r="42" fill="#e5484d"/>'],
    square: [50, '<rect x="10" y="10" width="80" height="80" rx="7" fill="#2f6fed"/>'],
    triangle: [63, '<polygon points="50,6 96,92 4,92" fill="#1f9d55"/>'],
    star: [56, `<polygon points="${novelPolygon(5, 48, 54, 24)}" fill="#e09b00"/>`],
    plus: [50, '<path d="M35 5h30v30h30v30H65v30H35V65H5V35h30z" fill="#f76808"/>'],
    heart: [48, '<path d="M50 93 L10 54 A23 23 0 0 1 50 19 A23 23 0 0 1 90 54 Z" fill="#e5484d"/>'],
    drop: [62, '<path d="M50 4 C62 24 86 44 86 62 A36 36 0 0 1 14 62 C14 44 38 24 50 4 Z" fill="#06aed5"/>'],
    hexagon: [50, `<polygon points="${novelPolygon(6, 46, 50)}" fill="#8e4ec6"/>`],
    pentagon: [55, `<polygon points="${novelPolygon(5, 47, 55)}" fill="#1f9d55"/>`],
    dome: [62, '<path d="M6 86 A44 44 0 0 1 94 86 Z" fill="#8e4ec6"/>'],
    cloud: [58, '<path d="M24 82 A18 18 0 0 1 22 46 A22 22 0 0 1 60 30 A20 20 0 0 1 82 50 A16 16 0 0 1 78 82 Z" fill="#2f6fed"/>'],
  };
  const NOVEL_MARKS = {
    none: () => '',
    dot: (y) => `<circle cx="50" cy="${y}" r="10"/>`,
    bar: (y) => `<rect x="31" y="${y - 6}" width="38" height="12" rx="4"/>`,
    ring: (y) => `<circle cx="50" cy="${y}" r="12" fill="none" stroke="#fff" stroke-width="7"/>`,
    tri: (y) => `<polygon points="50,${y - 13} 63,${y + 10} 37,${y + 10}"/>`,
  };
  const novelPicture = (shapeId, markId) => {
    const [markY, picture] = NOVEL_SHAPES[shapeId] || [50, '<circle cx="50" cy="50" r="42" fill="var(--axis)"/>'];
    const mark = (NOVEL_MARKS[markId] || NOVEL_MARKS.none)(markY);
    return picture + (mark ? `<g fill="#fff" stroke="rgba(0,0,0,0.22)" stroke-width="2.5" paint-order="stroke">${mark}</g>` : '');
  };

  // 짝 없는 것 찾기의 양말 (js/games/pair.js 와 같다, 80×110 · 발목이 위)
  const PAIR_COLORS = [['#e5484d', '#fff'], ['#2f6fed', '#fff'], ['#1f9d55', '#fff'], ['#f5b301', '#7a4b00'], ['#8e4ec6', '#fff'], ['#f76808', '#fff'], ['#06aed5', '#fff']].map(([fill, ink]) => ({ fill, ink }));
  const PAIR_SOCK = 'M16 8 H46 V62 C46 70 50 74 58 78 L70 84 C80 89 80 102 70 104 C64 106 58 104 52 101 L28 89 C18 84 16 76 16 66 Z';
  const PAIR_PATTERNS = {
    plain: () => '',
    stripes: (ink) => [30, 44, 58].map((y) => `<rect x="0" y="${y}" width="80" height="6" fill="${ink}"/>`).join(''),
    thin: (ink) => [32, 40, 48, 56].map((y) => `<rect x="0" y="${y}" width="80" height="2.5" fill="${ink}"/>`).join(''),
    dots: (ink) => [[24, 30], [38, 36], [24, 44], [38, 52], [26, 62], [40, 76], [56, 88], [68, 96]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.6" fill="${ink}"/>`).join(''),
    zigzag: (ink) => [38, 54].map((y) => `<polyline points="14,${y} 21,${y - 6} 28,${y} 35,${y - 6} 42,${y} 49,${y - 6}" fill="none" stroke="${ink}" stroke-width="3.2" stroke-linejoin="round"/>`).join(''),
    heart: (ink) => `<path d="M31 56 L22 47 A5.2 5.2 0 0 1 31 39 A5.2 5.2 0 0 1 40 47 Z" fill="${ink}"/>`,
    star: (ink) => `<g fill="${ink}">${SHAPES.star(31, 47, 10)}</g>`,
    vstripe: (ink) => [21, 29, 37].map((x) => `<rect x="${x}" y="20" width="4" height="46" fill="${ink}"/>`).join(''),
    toe: (ink) => `<path d="M56 74 L84 88 L84 112 L44 112 Z" fill="${ink}" opacity="0.9"/><circle cx="20" cy="84" r="9" fill="${ink}" opacity="0.9"/>`,
  };

  // 상자 속 과일 세기의 과일
  const FRUIT_ICONS = { apple: '🍎', watermelon: '🍉', grape: '🍇', pear: '🍐', orange: '🍊' };
  const fruitIcon = (id) => `<span class="rp-fruit" title="${escapeHtml(id)}">${FRUIT_ICONS[id] || escapeHtml(id)}</span>`;

  // 동전 세기의 동전·배지: 색마다 무늬가 따로 있다 (js/games/coin.js 의 TOKENS)
  const COIN_STYLE = {
    bronze: { fill: '#c7763f', mark: 'circle' }, red: { fill: '#d1343a', mark: 'star' }, blue: { fill: '#2557c9', mark: 'square' },
    green: { fill: '#1d8a4c', mark: 'triangle' }, black: { fill: '#2a2e36', mark: 'diamond' }, purple: { fill: '#7b3fb3', mark: 'plus' },
  };

  // 각 그리기는 (문제, 지금까지의 입력, 보이는 답 또는 null) → SVG
  const DRAW = {
    count(question, inputs, answer) {
      const data = question.data, [rows, cols] = data.grid, cellSize = 46, pad = 8;
      let body = '';
      data.cells.forEach((colorIndex, cellIndex) => {
        const x = pad + (cellIndex % cols) * cellSize, y = pad + Math.floor(cellIndex / cols) * cellSize;
        if (colorIndex < 0) { body += `<rect x="${x + 2}" y="${y + 2}" width="${cellSize - 4}" height="${cellSize - 4}" rx="6" class="b-grid"/>`; return; }
        const id = data.colors[colorIndex];
        body += `<rect x="${x + 2}" y="${y + 2}" width="${cellSize - 4}" height="${cellSize - 4}" rx="6" fill="${COUNT_COLORS[id]}"/>`;
        body += `<g fill="#fff" opacity="0.9">${SHAPES[COUNT_GLYPH[id]](x + cellSize / 2, y + cellSize / 2, 10)}</g>`;
      });
      const gridWidth = cols * cellSize + pad * 2, optionsTop = rows * cellSize + pad * 2 + 10, optionWidth = 64;
      const optionsLeft = Math.max(pad, (gridWidth - data.colors.length * optionWidth) / 2);
      data.colors.forEach((id, i) => {
        const x = optionsLeft + i * optionWidth, picked = answer && answer.picked === id, right = i === 0;
        body += `<rect x="${x + 4}" y="${optionsTop}" width="${optionWidth - 8}" height="40" rx="8" fill="${COUNT_COLORS[id]}" opacity="${answer ? (picked || right ? 1 : 0.35) : 0.85}"/>`;
        body += `<g fill="#fff">${SHAPES[COUNT_GLYPH[id]](x + 20, optionsTop + 20, 8)}</g>`;
        body += `<text x="${x + optionWidth - 16}" y="${optionsTop + 25}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${answer ? data.counts[i] : '?'}</text>`;
        if (picked) body += `<rect x="${x + 1}" y="${optionsTop - 3}" width="${optionWidth - 2}" height="46" rx="10" fill="none" stroke-width="3" class="${right ? 's-good' : 's-bad'}"/>`;
      });
      return svg(Math.max(gridWidth, optionsLeft * 2 + data.colors.length * optionWidth), optionsTop + 48, body, '색 격자와 보기');
    },

    path(question, inputs, answer) {
      const data = question.data, [rows, cols] = data.grid, cellSize = 54, pad = 10;
      const centerX = (column) => pad + column * cellSize + cellSize / 2, centerY = (row) => pad + row * cellSize + cellSize / 2;
      let body = '';
      for (let row = 0; row < rows; row++) for (let column = 0; column < cols; column++) body += `<rect x="${pad + column * cellSize + 3}" y="${pad + row * cellSize + 3}" width="${cellSize - 6}" height="${cellSize - 6}" rx="8" class="b-surf s-axis" stroke-width="1"/>`;
      // 보여 준 길 (점선)
      body += `<polyline points="${data.path.map(([row, column]) => `${centerX(column)},${centerY(row)}`).join(' ')}" fill="none" class="s-axis" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>`;
      const [startRow, startColumn] = data.path[0];
      body += `<rect x="${pad + startColumn * cellSize + 3}" y="${pad + startRow * cellSize + 3}" width="${cellSize - 6}" height="${cellSize - 6}" rx="8" class="b-ink2"/><text x="${centerX(startColumn)}" y="${centerY(startRow) + 4}" text-anchor="middle" font-size="11" font-weight="700" class="b-surf">출발</text>`;
      inputs.forEach((input, i) => {
        const [row, column] = input.cell;
        body += `<rect x="${pad + column * cellSize + 3}" y="${pad + row * cellSize + 3}" width="${cellSize - 6}" height="${cellSize - 6}" rx="8" class="f-series" opacity="0.18"/>`;
        body += badge(centerX(column), centerY(row), i + 1);
      });
      if (answer && answer.wrongCell) {
        const [row, column] = answer.wrongCell;
        body += `<rect x="${pad + column * cellSize + 3}" y="${pad + row * cellSize + 3}" width="${cellSize - 6}" height="${cellSize - 6}" rx="8" fill="none" class="s-bad" stroke-width="3"/>`;
        body += `<text x="${centerX(column)}" y="${centerY(row) + 6}" text-anchor="middle" font-size="18" font-weight="700" class="f-bad">✕</text>`;
      }
      return svg(cols * cellSize + pad * 2, rows * cellSize + pad * 2, body, '길 격자와 누른 칸');
    },

    arith(question, inputs, answer) {
      const data = question.data, slotCount = data.ops.length + 1, slotSize = 52, gap = 30;
      const filled = Array(slotCount).fill(null);
      (data.given || []).forEach((i) => (filled[i] = data.sol[i]));
      for (const input of inputs) { if ('put' in input) filled[input.slot] = input.put; else if ('remove' in input) filled[input.slot] = null; }
      if (answer && answer.fill) answer.fill.forEach((value, i) => (filled[i] = value));
      let body = '', x = 10;
      for (let i = 0; i < slotCount; i++) {
        const given = (data.given || []).includes(i);
        body += `<rect x="${x}" y="10" width="${slotSize}" height="${slotSize}" rx="8" class="${given ? 'b-grid' : 'b-surf'} s-axis" stroke-width="1.5"/>`;
        if (filled[i] != null) body += `<text x="${x + slotSize / 2}" y="${10 + slotSize / 2 + 8}" text-anchor="middle" font-size="24" font-weight="700" class="b-ink">${filled[i]}</text>`;
        x += slotSize;
        if (i < slotCount - 1) { body += `<text x="${x + gap / 2}" y="${10 + slotSize / 2 + 8}" text-anchor="middle" font-size="22" class="b-ink2">${data.ops[i] === '+' ? '+' : '−'}</text>`; x += gap; }
      }
      body += `<text x="${x + gap / 2}" y="${10 + slotSize / 2 + 8}" text-anchor="middle" font-size="22" class="b-ink2">=</text>`;
      x += gap;
      body += `<text x="${x + 4}" y="${10 + slotSize / 2 + 9}" font-size="26" font-weight="700" class="b-ink">${data.ans}</text>`;
      const width = x + 60;
      // 보기
      const candidateWidth = 44, candidatesLeft = Math.max(10, (width - data.cands.length * (candidateWidth + 8)) / 2);
      data.cands.forEach((value, i) => {
        const used = filled.includes(value), candidateX = candidatesLeft + i * (candidateWidth + 8);
        body += `<rect x="${candidateX}" y="${slotSize + 34}" width="${candidateWidth}" height="38" rx="8" class="${used ? 'b-grid' : 'b-surf'} s-axis" stroke-width="1"/>`;
        body += `<text x="${candidateX + candidateWidth / 2}" y="${slotSize + 59}" text-anchor="middle" font-size="16" font-weight="600" class="${used ? 'b-mut' : 'b-ink'}">${value}</text>`;
      });
      if (answer && !answer.correct) body += `<text x="10" y="${slotSize + 98}" font-size="12" class="b-ink2">풀이 예: ${data.sol.map((value, i) => (i ? ` ${data.ops[i - 1] === '+' ? '+' : '−'} ` : '') + value).join('')} = ${data.ans}</text>`;
      return svg(width, slotSize + (answer && !answer.correct ? 108 : 86), body, '식과 보기');
    },

    compare(question, inputs, answer) {
      const data = question.data, gridSize = data.grid, spacing = 36, pad = 16, side = (gridSize - 1) * spacing + pad * 2, gap = 34;
      const lineKey = (line) => line.slice(0, 4).join(',');
      const sameLine = (a, b) => lineKey(a) === lineKey(b) || lineKey(a) === [b[2], b[3], b[0], b[1]].join(',');
      const change = data.change || {};
      let right = data.left.filter((line) => !(change.removed && sameLine(line, change.removed))).map((line) => line.slice());
      if (change.added) right.push(change.added.slice());
      if (change.restyled) right = right.map((line) => (sameLine(line, change.restyled) ? change.restyled.slice() : line));
      const isChanged = (line, onLeft) => answer && data.change && ((onLeft && change.removed && sameLine(line, change.removed)) || (!onLeft && ((change.added && sameLine(line, change.added)) || (change.restyled && sameLine(line, change.restyled)))) || (change.restyled && sameLine(line, change.restyled)));
      const card = (cardLeft, lines, onLeft) => {
        let cardBody = `<rect x="${cardLeft}" y="0" width="${side}" height="${side}" rx="10" class="b-surf s-axis" stroke-width="1"/>`;
        for (let y = 0; y < gridSize; y++) for (let x = 0; x < gridSize; x++) cardBody += `<circle cx="${cardLeft + pad + x * spacing}" cy="${pad + y * spacing}" r="2.2" class="b-mut"/>`;
        for (const line of lines) {
          const [fromX, fromY, toX, toY, lineStyle] = line, highlighted = isChanged(line, onLeft);
          const ends = `x1="${cardLeft + pad + fromX * spacing}" y1="${pad + fromY * spacing}" x2="${cardLeft + pad + toX * spacing}" y2="${pad + toY * spacing}" stroke-linecap="round"`;
          const stroke = highlighted ? 'var(--late)' : 'var(--ink)';
          cardBody += `<line ${ends} stroke="${stroke}" stroke-width="${lineStyle === 'h' ? 8 : 5}"/>`;
          if (lineStyle === 'h') cardBody += `<line ${ends} stroke="var(--hollow-in)" stroke-width="3.5"/>`;
        }
        return cardBody;
      };
      let body = card(0, data.left, true) + card(side + gap, right, false);
      body += `<text x="${side + gap / 2}" y="${side / 2 + 6}" text-anchor="middle" font-size="16" class="b-mut">↔</text>`;
      const height = side + 44, mid = side + gap / 2;
      const option = (x, label, value) => {
        const picked = answer && answer.picked === value, rightAnswer = (value === 'same') === data.same;
        const strokeClass = picked ? (rightAnswer ? 's-good' : 's-bad') : 's-axis';
        return `<rect x="${x}" y="${side + 12}" width="96" height="30" rx="15" class="b-surf ${strokeClass}" stroke-width="${picked ? 3 : 1}"/><text x="${x + 48}" y="${side + 32}" text-anchor="middle" font-size="13" font-weight="600" class="${answer && rightAnswer ? 'b-ink' : 'b-ink2'}">${label}</text>`;
      };
      body += option(mid - 104, '같아요', 'same') + option(mid + 8, '달라요', 'diff');
      return svg(side * 2 + gap, height, body, '두 그림과 보기');
    },

    // 배관 타기: 사다리 타기와 판 모양(위 조각 · 아래 구멍)이 같아 같은 그림을 쓴다
    pipe(question, inputs, answer) {
      return DRAW.ladder(question, inputs, answer);
    },

    ladder(question, inputs, answer) {
      const data = question.data, lanes = data.lanes, laneGap = 70, boardHeight = 230, top = 42, pad = 30;
      const laneX = (i) => pad + i * laneGap, heightY = (fraction) => top + fraction * boardHeight;
      let body = '';
      // 위의 조각과 아래 구멍을 얹어 마무리한다 (두 판 공통)
      const finish = (finishedBody, label) => {
        data.pegs.forEach((shape, i) => {
          const picked = answer && answer.picked === i;
          finishedBody += `<g class="${picked ? (answer.correct ? 'f-good' : 'f-bad') : 'b-ink2'}">${(SHAPES[shape] || SHAPES.circle)(laneX(i), top - 22, 11)}</g>`;
        });
        data.holes.forEach((shape, i) => {
          if (!shape) return;
          finishedBody += `<g fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="3 2">${(SHAPES[shape] || SHAPES.circle)(laneX(i), top + boardHeight + 22, 11)}</g>`;
        });
        return svg(pad * 2 + (lanes - 1) * laneGap, top + boardHeight + 44, finishedBody, label);
      };
      // 배관 타기 (pipe, 2026-11-20 부터)는 관마다 그린 점(lines)을, 예전 사다리 타기 (ladder)는 가로줄(rungs)을 남긴다
      if (data.lines) {
        // 선마다 그린 점 [x, y, x, y, ...] (게임 판 좌표, 화면에 그린 관의 가운데 줄)
        // 판 좌표 → 이 그림 좌표: 출발점들의 x 를 laneX(0) ~ laneX(lanes - 1) 에, 선의 위 끝 ~ 아래 끝을 top ~ top + boardHeight 에 맞춘다
        const startX = data.lines.map((line) => line[0]);
        const [boardLeft, boardRight] = [Math.min(...startX), Math.max(...startX)];
        const boardTop = data.lines[0][1], boardBottom = data.lines[0][data.lines[0].length - 1];
        const toPictureX = (x) => laneX(0) + ((x - boardLeft) / (boardRight - boardLeft)) * (laneX(lanes - 1) - laneX(0));
        const toPictureY = (y) => top + ((y - boardTop) / (boardBottom - boardTop)) * boardHeight;
        const pointsOf = (line) => line.reduce((out, value, i) => (i % 2 ? out : [...out, `${toPictureX(value).toFixed(1)},${toPictureY(line[i + 1]).toFixed(1)}`]), []).join(' ');
        for (const line of data.lines) body += `<polyline points="${pointsOf(line)}" fill="none" class="s-axis" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
        const traceOf = (start) => `${laneX(start)},${top - 10} ${pointsOf(data.lines[start])}`;
        if (answer) {
          if (answer.picked !== data.answer) body += `<polyline points="${traceOf(data.answer)}" fill="none" class="s-good" stroke-width="3" stroke-dasharray="6 5" stroke-linejoin="round"/>`;
          if (answer.picked != null) body += `<polyline points="${traceOf(answer.picked)}" fill="none" class="${answer.correct ? 's-good' : 's-bad'}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`;
        }
        return finish(body, '배관');
      }
      for (let i = 0; i < lanes; i++) body += `<line x1="${laneX(i)}" y1="${top}" x2="${laneX(i)}" y2="${top + boardHeight}" class="s-axis" stroke-width="4" stroke-linecap="round"/>`;
      for (const [i, leftY, rightY] of data.rungs) body += `<line x1="${laneX(i)}" y1="${heightY(leftY)}" x2="${laneX(i + 1)}" y2="${heightY(rightY)}" class="s-axis" stroke-width="4" stroke-linecap="round"/>`;
      const trace = (start) => {
        let lane = start, y = 0; const points = [[laneX(lane), heightY(0)]];
        for (let guard = 0; guard < 99; guard++) {
          let best = null;
          for (const [i, leftY, rightY] of data.rungs) {
            if (i === lane && leftY > y + 1e-9 && (!best || leftY < best.y)) best = { y: leftY, toLane: i + 1, landingY: rightY };
            if (i + 1 === lane && rightY > y + 1e-9 && (!best || rightY < best.y)) best = { y: rightY, toLane: i, landingY: leftY };
          }
          if (!best) break;
          points.push([laneX(lane), heightY(best.y)], [laneX(best.toLane), heightY(best.landingY)]);
          lane = best.toLane; y = best.landingY;
        }
        points.push([laneX(lane), heightY(1)]);
        return points.map((point) => point.join(',')).join(' ');
      };
      if (answer) {
        if (answer.picked !== data.answer) body += `<polyline points="${trace(data.answer)}" fill="none" class="s-good" stroke-width="3" stroke-dasharray="6 5" stroke-linejoin="round"/>`;
        if (answer.picked != null) body += `<polyline points="${trace(answer.picked)}" fill="none" class="${answer.correct ? 's-good' : 's-bad'}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`;
      }
      return finish(body, '사다리');
    },

    seek(question, inputs, answer) {
      const data = question.data, cellSize = 24, sqrt3 = Math.sqrt(3);
      const centers = data.cells.map(([axialQ, axialR]) => [sqrt3 * (axialQ + axialR / 2) * cellSize, 1.5 * axialR * cellSize]);
      const centerXs = centers.map((center) => center[0]), centerYs = centers.map((center) => center[1]);
      const minX = Math.min(...centerXs) - cellSize, minY = Math.min(...centerYs) - cellSize, width = Math.max(...centerXs) - minX + cellSize, top = 56;
      const hexPoints = (x, y, size) => Array.from({ length: 6 }, (_, corner) => { const angle = Math.PI / 180 * (60 * corner - 30); return `${(x + size * Math.cos(angle)).toFixed(1)},${(y + size * Math.sin(angle)).toFixed(1)}`; }).join(' ');
      let body = '';
      // 찾을 순서
      const sequenceLeft = width / 2 - (data.seq.length * 34) / 2;
      body += `<text x="${width / 2}" y="12" text-anchor="middle" font-size="11" class="b-mut">찾을 순서</text>`;
      data.seq.forEach((symbol, i) => { body += `<rect x="${sequenceLeft + i * 34 + 2}" y="18" width="30" height="30" rx="6" class="b-surf s-axis" stroke-width="1"/><g class="b-ink">${SHAPES[SEEK_GLYPHS[symbol % 8]](sequenceLeft + i * 34 + 17, 33, 9)}</g>`; });
      centers.forEach(([x, y], i) => {
        const cellX = x - minX, cellY = y - minY + top, inAnswer = answer && data.answer.includes(i), picked = answer && answer.cell === i;
        body += `<polygon points="${hexPoints(cellX, cellY, cellSize * 0.95)}" class="${inAnswer ? 'f-good' : 'b-surf'} s-axis" stroke-width="1" ${inAnswer ? 'fill-opacity="0.22"' : ''}/>`;
        body += `<g class="b-ink">${SHAPES[SEEK_GLYPHS[data.syms[i] % 8]](cellX, cellY, 8.5)}</g>`;
        if (picked) body += `<polygon points="${hexPoints(cellX, cellY, cellSize * 0.82)}" fill="none" class="${answer.correct ? 's-good' : 's-bad'}" stroke-width="3"/>`;
      });
      return svg(width, Math.max(...centerYs) - minY + cellSize + top, body, '육각 판과 찾을 순서');
    },

    // 심볼 위치 외우기: 2×4 판에 외울 때 보여 준 심볼을 옅게, 위에 물은 심볼
    symbol(question, inputs, answer) {
      const data = question.data, cellSize = 58, pad = 8, top = 58, placed = new Map(data.board || []);
      let body = `<text x="${pad}" y="14" font-size="11" class="b-mut">이 그림이 있던 칸은?</text>`;
      body += `<rect x="${pad}" y="20" width="30" height="30" rx="6" class="b-surf s-axis" stroke-width="1"/><g class="b-ink">${glyph(data.target, pad + 15, 35, 10)}</g>`;
      for (let slot = 0; slot < 8; slot++) {
        const x = pad + (slot % 4) * cellSize, y = top + Math.floor(slot / 4) * cellSize, isAnswer = answer && slot === data.slot;
        body += `<rect x="${x + 3}" y="${y + 3}" width="${cellSize - 6}" height="${cellSize - 6}" rx="8" class="${isAnswer ? 'f-good' : 'b-surf'} s-axis" stroke-width="1" ${isAnswer ? 'fill-opacity="0.2"' : ''}/>`;
        if (placed.has(slot)) body += `<g class="${slot === data.slot ? 'b-ink2' : 'b-mut'}" opacity="0.75">${glyph(placed.get(slot), x + cellSize / 2, y + cellSize / 2, 14)}</g>`;
        body += pickRing(x + 3, y + 3, cellSize - 6, cellSize - 6, answer, answer && answer.picked === slot, isAnswer);
      }
      return svg(pad * 2 + 4 * cellSize, top + 2 * cellSize + pad, body, '심볼 판과 고른 칸');
    },

    // 빈자리 채우기: 위에 빈자리(선이 끝나는 자리), 아래에 화면에 보인 대로 돌린 보기 조각
    fit(question, inputs, answer) {
      const data = question.data, choices = data.shown || [], gapSize = 46, size = 30, choiceWidth = 76, pad = 10;
      const width = Math.max(gapSize * 2 + pad * 2, choices.length * choiceWidth + pad * 2), choicesTop = gapSize * 2 + 34;
      let body = `<text x="${width / 2}" y="12" text-anchor="middle" font-size="11" class="b-mut">빈자리</text>`;
      body += fitHex(width / 2, 18 + gapSize, gapSize, data.gap, 0, true);
      choices.forEach((choice, i) => {
        const centerX = pad + i * choiceWidth + choiceWidth / 2, centerY = choicesTop + size + 6;
        body += fitHex(centerX, centerY, size, choice.piece, choice.rot || 0, false);
        body += pickRing(centerX - size - 6, centerY - size - 6, 2 * size + 12, 2 * size + 12, answer, answer && answer.picked === i, choice.answer);
      });
      return svg(width, choicesTop + 2 * size + 20, body, '빈자리와 보기 조각');
    },

    // 가린 숫자 더하기: 판의 숫자(덮인 것은 상자 색, 숫자는 옅게), 식에 든 두 숫자, 보기
    cover(question, inputs, answer) {
      const data = question.data, tokenSize = 44, gap = 8, pad = 8, terms = data.terms || [];
      const width = Math.max(pad * 2 + data.values.length * (tokenSize + gap) - gap, optionRowWidth((data.opts || []).length), 280);
      const left = (width - (data.values.length * (tokenSize + gap) - gap)) / 2;
      let body = '';
      data.values.forEach((value, i) => {
        const x = left + i * (tokenSize + gap), mark = data.marks[i], term = terms.indexOf(i);
        body += mark
          ? `<rect x="${x}" y="${pad + 10}" width="${tokenSize}" height="${tokenSize}" rx="8" fill="${MARK_COLORS[mark] || 'var(--axis)'}"/><text x="${x + tokenSize / 2}" y="${pad + 10 + tokenSize / 2 + 6}" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" opacity="0.75">${value}</text>`
          : `<rect x="${x}" y="${pad + 10}" width="${tokenSize}" height="${tokenSize}" rx="8" class="b-surf s-axis" stroke-width="1"/><text x="${x + tokenSize / 2}" y="${pad + 10 + tokenSize / 2 + 7}" text-anchor="middle" font-size="20" font-weight="700" class="b-ink">${value}</text>`;
        if (term >= 0) body += `<rect x="${x - 3}" y="${pad + 7}" width="${tokenSize + 6}" height="${tokenSize + 6}" rx="10" fill="none" class="s-series" stroke-width="2.5"/>` + badge(x + tokenSize / 2, pad + 4, term + 1);
      });
      // 덮인 숫자는 상자 색 ■ 를 앞에 붙인다
      const termText = (i) => (data.marks[i] ? `<tspan fill="${MARK_COLORS[data.marks[i]] || 'var(--axis)'}">■</tspan>${data.values[i]}` : data.values[i]);
      body += `<text x="${width / 2}" y="${pad + tokenSize + 40}" text-anchor="middle" font-size="15" font-weight="600" class="b-ink">${terms.map(termText).join(' + ')} = ${answer ? data.ans : '?'}</text>`;
      const optionsTop = pad + tokenSize + 56;
      body += optionRow(data.opts || [], width, optionsTop, { right: data.ans, answer });
      return svg(width, optionsTop + 44, body, '숫자 판과 식, 보기');
    },

    // 없던 그림 찾기: 바뀌기 전과 뒤의 판. 답한 뒤 새 그림 칸을 보인다
    novel(question, inputs, answer) {
      const data = question.data, [rows, cols] = data.grid, cellSize = 46, pad = 6, gap = 26, top = 18;
      const side = cols * cellSize, width = side * 2 + gap + pad * 2;
      const board = (left, items, isAfter) => {
        let out = '';
        for (let cell = 0; cell < rows * cols; cell++) {
          const x = left + (cell % cols) * cellSize, y = top + Math.floor(cell / cols) * cellSize;
          out += `<rect x="${x + 2}" y="${y + 2}" width="${cellSize - 4}" height="${cellSize - 4}" rx="7" class="b-surf s-axis" stroke-width="1"/>`;
        }
        for (const [cell, shapeId, markId] of items) {
          const x = left + (cell % cols) * cellSize, y = top + Math.floor(cell / cols) * cellSize;
          out += `<g transform="translate(${x + 6} ${y + 6}) scale(${(cellSize - 12) / 100})">${novelPicture(shapeId, markId)}</g>`;
          if (isAfter) out += pickRing(x + 2, y + 2, cellSize - 4, cellSize - 4, answer, answer && answer.cell === cell, cell === data.at);
        }
        return out;
      };
      let body = `<text x="${pad + side / 2}" y="12" text-anchor="middle" font-size="11" class="b-mut">바뀌기 전</text><text x="${pad + side + gap + side / 2}" y="12" text-anchor="middle" font-size="11" class="b-mut">바뀐 뒤 (답하는 판)</text>`;
      body += board(pad, data.before || [], false) + board(pad + side + gap, data.after || [], true);
      body += `<text x="${pad + side + gap / 2}" y="${top + (rows * cellSize) / 2 + 5}" text-anchor="middle" font-size="16" class="b-mut">→</text>`;
      const note = [data.mode === 'replace' ? '있던 그림 하나를 바꿈' : '빈 칸에 하나를 더함', data.moved ? `자리 바꾼 그림 ${data.moved}개` : null, data.similar ? '모양이 같은 그림이 판에 있음' : null].filter(Boolean).join(' · ');
      body += `<text x="${width / 2}" y="${top + rows * cellSize + 18}" text-anchor="middle" font-size="11" class="b-ink2">${escapeHtml(note)}</text>`;
      return svg(width, top + rows * cellSize + 26, body, '바뀌기 전과 뒤의 판');
    },

    // 공 따라가기: 처음 자리(★ = 따라갈 공)와 끝 자리. 고른 공에 누른 차례
    track(question, inputs, answer) {
      const data = question.data, scale = 1.5, radius = 7, arenaWidth = (160 + 2 * radius) * scale, arenaHeight = (100 + 2 * radius) * scale, gap = 20, top = 18;
      const targets = new Set(data.targets || []), toX = (left, x) => left + (x + radius) * scale, toY = (y) => top + (y + radius) * scale;
      const arena = (left) => `<rect x="${left}" y="${top}" width="${arenaWidth}" height="${arenaHeight}" rx="${radius * scale}" class="b-surf s-axis" stroke-width="1"/>`;
      let body = `<text x="${arenaWidth / 2}" y="12" text-anchor="middle" font-size="11" class="b-mut">처음 (★ 따라갈 공)</text><text x="${arenaWidth + gap + arenaWidth / 2}" y="12" text-anchor="middle" font-size="11" class="b-mut">끝 (고르는 판)</text>`;
      body += arena(0) + arena(arenaWidth + gap);
      (data.start || []).forEach(([x, y], i) => {
        body += `<circle cx="${toX(0, x)}" cy="${toY(y)}" r="${radius * scale}" class="${targets.has(i) ? 'f-series' : 'b-grid'}" ${targets.has(i) ? 'fill-opacity="0.85"' : ''}/>`;
        if (targets.has(i)) body += `<text x="${toX(0, x)}" y="${toY(y) + 4}" text-anchor="middle" font-size="11" class="f-on">★</text>`;
      });
      const order = new Map(inputs.map((input, i) => [input.ball, { n: i + 1, correct: input.correct }]));
      const picked = new Set(answer && answer.picked ? answer.picked : inputs.map((input) => input.ball));
      (data.end || []).forEach(([x, y], i) => {
        const centerX = toX(arenaWidth + gap, x), centerY = toY(y), pick = order.get(i);
        body += `<circle cx="${centerX}" cy="${centerY}" r="${radius * scale}" class="b-grid s-axis" stroke-width="1"/>`;
        if (picked.has(i)) {
          const right = targets.has(i);
          body += `<circle cx="${centerX}" cy="${centerY}" r="${radius * scale + 3}" fill="none" class="${right ? 's-good' : 's-bad'}" stroke-width="3"/>`;
          if (pick) body += badge(centerX, centerY, pick.n, right ? 'f-good' : 'f-bad');
        } else if (answer && targets.has(i)) body += `<circle cx="${centerX}" cy="${centerY}" r="${radius * scale + 3}" fill="none" class="s-good" stroke-width="2" stroke-dasharray="4 3"/>`;
      });
      const caption = `공 ${(data.start || []).length}개 중 ${targets.size}개 · ${((data.move || 0) / 1000).toFixed(1)}초 움직임${data.pass ? ' · 서로 지나감' : ''}${answer ? ` · 맞힌 공 ${answer.hits ?? '–'}/${answer.of ?? targets.size}` : ''}`;
      body += `<text x="${arenaWidth + gap / 2}" y="${top + arenaHeight + 18}" text-anchor="middle" font-size="11" class="b-ink2">${escapeHtml(caption)}</text>`;
      return svg(arenaWidth * 2 + gap, top + arenaHeight + 26, body, '처음과 끝의 공 자리');
    },

    // 지시 따르기: 지시 글, 조작판(램프 · 스위치 · 버튼)에 누른 차례. 답한 뒤 정답 조작을 점선으로
    follow(question, inputs, answer) {
      const data = question.data, size = 46, gap = 10, pad = 8;
      const rows = [['l', data.lamps || []], ['s', data.swOn || []], ['b', data.buttons || []]].filter(([, items]) => items.length);
      const longest = Math.max(1, ...rows.map(([, items]) => items.length)), width = pad * 2 + longest * (size + gap) - gap;
      const presses = {};
      inputs.forEach((input, i) => (presses[input.ctrl] ||= []).push({ n: i + 1, ok: input.correct && !input.early }));
      const expected = new Set(data.answer || []);
      let body = '', y = pad + 12;
      for (const [prefix, items] of rows) {
        const left = (width - (items.length * (size + gap) - gap)) / 2;
        items.forEach((item, i) => {
          const id = `${prefix}${i}`, x = left + i * (size + gap), pressed = presses[id] || [];
          if (prefix === 'l') body += `<circle cx="${x + size / 2}" cy="${y + size / 2}" r="${size / 2 - 6}" ${item ? 'fill="var(--late)"' : 'class="b-grid s-axis" stroke-width="1"'}/>`;
          else if (prefix === 's') {
            const on = item || pressed.length > 0;
            body += `<rect x="${x + 4}" y="${y + 12}" width="${size - 8}" height="${size - 24}" rx="${(size - 24) / 2}" class="${on ? 'f-series' : 'b-grid'} s-axis" stroke-width="1"/><circle cx="${on ? x + size - 15 : x + 15}" cy="${y + size / 2}" r="${(size - 30) / 2}" class="b-surf"/>`;
          } else body += `<rect x="${x}" y="${y}" width="${size}" height="${size}" rx="10" class="b-surf s-axis" stroke-width="1"/><g class="b-ink">${glyph(item, x + size / 2, y + size / 2, 13)}</g>`;
          if (answer && expected.has(id)) body += `<rect x="${x - 3}" y="${y - 3}" width="${size + 6}" height="${size + 6}" rx="12" fill="none" class="s-good" stroke-width="2" stroke-dasharray="4 3"/>`;
          pressed.forEach((press, j) => (body += badge(x + size - 4 - j * 14, y + 2, press.n, press.ok ? 'f-good' : 'f-bad')));
        });
        y += size + gap + 8;
      }
      const nameOf = (id) => (id[0] === 'b' ? `<svg class="rp-ico" viewBox="-12 -12 24 24"><g class="b-ink">${glyph((data.buttons || [])[Number(id.slice(1))], 0, 0, 10)}</g></svg>` : id[0] === 's' ? `스위치 ${Number(id.slice(1)) + 1}` : `램프 ${Number(id.slice(1)) + 1}`);
      const ordered = (data.groups || []).some((group) => group.ordered);
      const notes = [data.read ? '읽는 단계 뒤 지시를 가림' : null, data.go ? `기다림: ${escapeHtml(typeof data.go === 'string' ? data.go : JSON.stringify(data.go))}` : null, `종류 ${escapeHtml(data.kind || '?')}`].filter(Boolean).join(' · ');
      return `<div class="rp-col"><p class="rp-text">${escapeHtml(data.text || '')}</p>${svg(width, y - 8, body, '조작판과 누른 차례')}` +
        (answer ? `<p class="rp-note">정답 조작: ${(data.answer || []).map(nameOf).join(ordered ? ' → ' : ' · ') || '없음'}</p>` : '') + `<p class="rp-note">${notes}</p></div>`;
    },

    // 짝 없는 것 찾기: 빨랫줄의 양말들. 답한 뒤 짝 없는 양말을 보인다
    pair(question, inputs, answer) {
      const data = question.data, socks = data.socks || [], perRow = Math.min(socks.length, 8), scale = 0.56, cellWidth = 54, cellHeight = 72, pad = 6;
      let body = `<defs><clipPath id="rp-sock"><path d="${PAIR_SOCK}"/></clipPath></defs>`;
      socks.forEach(([pattern, cuff, color, flip], i) => {
        const x = pad + (i % perRow) * cellWidth, y = pad + Math.floor(i / perRow) * cellHeight, palette = PAIR_COLORS[color] || PAIR_COLORS[0];
        const cuffBand = cuff ? '<rect x="0" y="0" width="80" height="20" fill="#f7f8fa"/>' : '<rect x="0" y="18" width="80" height="2.5" fill="rgba(0,0,0,0.22)"/>';
        const sock = `<path d="${PAIR_SOCK}" fill="${palette.fill}"/><g clip-path="url(#rp-sock)">${(PAIR_PATTERNS[pattern] || PAIR_PATTERNS.plain)(palette.ink)}${cuffBand}</g><path d="${PAIR_SOCK}" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="2"/>`;
        body += `<g transform="translate(${x + 3} ${y + 4}) scale(${scale})"><g ${flip ? 'transform="translate(84 0) scale(-1 1)"' : ''}>${sock}</g></g>`;
        body += pickRing(x, y, cellWidth - 4, cellHeight - 6, answer, answer && answer.picked === i, i === data.odd);
      });
      const rows = Math.ceil(socks.length / perRow);
      return svg(pad * 2 + perRow * cellWidth, pad * 2 + rows * cellHeight + (data.lure ? 14 : 0), body + (data.lure ? `<text x="${pad}" y="${pad + rows * cellHeight + 10}" font-size="11" class="b-ink2">미끼: 한 짝과 ${data.lure === 'cuff' ? '발목' : '무늬'}만 다름</text>` : ''), '양말들과 고른 양말');
    },

    // 상자 속 과일 세기: 처음 든 과일, 차례마다 드나든 과일, (답한 뒤) 끝에 든 과일, 질문과 보기
    box(question, inputs, answer) {
      const data = question.data, boxes = data.boxes || ['A'], twoBoxes = boxes.length > 1, ask = data.ask || {};
      const where = (spot) => ({ L: '밖', R: '밖', A: twoBoxes ? '위 상자' : '상자', B: '아래 상자' })[spot] || spot;
      const fruits = (counts) => Object.entries(counts || {}).flatMap(([kind, count]) => Array(count).fill(fruitIcon(kind))).join('') || '<span class="rp-mut">비었음</span>';
      const contents = (label, all) => `<tr><th>${label}</th><td>${boxes.map((spot) => `${twoBoxes ? `<b>${where(spot)}</b> ` : ''}${fruits(all && all[spot])}`).join('<br>')}</td></tr>`;
      const moveText = (move) => {
        const route = move.from === 'L' && move.to === 'R' ? '지나감' : move.from === 'L' ? `${where(move.to)}에 들어감` : move.to === 'R' ? `${where(move.from)}에서 나감` : `${where(move.from)} → ${where(move.to)}`;
        return `<span class="${move.decoy ? 'rp-mut' : ''}">${(move.fruits || []).map(fruitIcon).join('')} ${route}</span>`;
      };
      const stepRows = (data.steps || []).map((moves, i) => `<tr><th>${i + 1}</th><td>${moves.map(moveText).join('<br>')}</td></tr>`).join('');
      const place = twoBoxes ? `${where(ask.box)} 안에` : '상자 안에';
      const kinds = ask.kinds || [];
      const text = { total: `${place} 과일이 모두 몇 개?`, kind: `${place} ${fruitIcon(kinds[0])} 몇 개?`, most: `${place} 가장 많은 과일은?` }[ask.type] || `${fruitIcon(kinds[0])} 가 ${fruitIcon(kinds[1])} 보다 몇 개 더?`;
      return `<div class="rp-col"><table class="rp-steps">${contents('처음', data.start)}${stepRows}${answer ? contents('끝', data.end) : ''}</table>` +
        `<p class="rp-text">${text}</p>${optionChips(data.opts || [], { right: data.ans, answer, label: ask.type === 'most' ? fruitIcon : escapeHtml })}</div>`;
    },

    // 동전 세기: 탁자 위 동전(나중 것이 위), 값 표, 보기
    coin(question, inputs, answer) {
      const data = question.data, scale = 1.2, tableSize = 220 * scale, radius = 22 * scale, tableWidth = 150;
      const kinds = data.kinds || [], values = data.values || [], valueMode = data.mode === 'value';
      let body = `<rect x="0" y="0" width="${tableSize}" height="${tableSize}" rx="12" fill="#2a4560"/>`;
      for (const [kind, x, y, lift = 0, tilt = 0] of data.coins || []) {
        const centerX = x * scale, centerY = (y - lift) * scale, style = COIN_STYLE[kind] || COIN_STYLE.bronze;
        body += `<g transform="translate(${centerX} ${centerY}) rotate(${tilt})"><ellipse rx="${radius}" ry="${radius * 0.62}" fill="${style.fill}" stroke="rgba(0,0,0,0.45)" stroke-width="1.5"/>` +
          `<g fill="#fff" transform="scale(1 0.62)">${glyph(style.mark, 0, 0, radius * 0.42)}</g></g>`;
      }
      let y = 14;
      body += `<text x="${tableSize + 14}" y="${y}" font-size="11" class="b-mut">${valueMode ? '값 표' : '개수 세기'}</text>`;
      kinds.forEach((kind, i) => {
        y += 30;
        const style = COIN_STYLE[kind] || COIN_STYLE.bronze;
        body += `<g transform="translate(${tableSize + 28} ${y - 5})"><ellipse rx="12" ry="12" fill="${style.fill}"/><g fill="#fff">${glyph(style.mark, 0, 0, 6)}</g></g>`;
        body += `<text x="${tableSize + 48}" y="${y}" font-size="14" font-weight="600" class="b-ink">${valueMode ? `${values[i]}점` : ''}${answer ? ` × ${(data.counts || [])[i] ?? '?'}` : ''}</text>`;
      });
      const width = Math.max(tableSize + tableWidth, optionRowWidth((data.opts || []).length)), optionsTop = tableSize + 14;
      body += optionRow(data.opts || [], width, optionsTop, { right: data.ans, answer, unit: valueMode ? '점' : '' });
      return svg(width, optionsTop + 44, body, '탁자 위 동전과 보기');
    },

    // 차례대로 외우기: 나온 차례대로의 그림, 칸마다 고른 값
    recall(question, inputs, answer) {
      const data = question.data, items = data.items || [], answers = data.ans || [], cellSize = 50, gap = 8, pad = 8;
      const width = Math.max(pad * 2 + items.length * (cellSize + gap) - gap, 220), left = (width - (items.length * (cellSize + gap) - gap)) / 2;
      const picture = ([shape, count], x, y, size) => Array.from({ length: count }, (_, i) => glyph(shape, x + (i - (count - 1) / 2) * size * 0.3, y, size * 0.15)).join('');
      const valueOf = (value, x, y) => (data.ask === 'count' ? `<text x="${x}" y="${y + 7}" text-anchor="middle" font-size="20" font-weight="700" class="b-ink">${value}</text>` : `<g class="b-ink">${glyph(value, x, y, 12)}</g>`);
      const picked = answer ? [...(answer.picked || [])] : [];
      inputs.forEach((input) => (picked[input.slot] = input.picked));
      let body = `<text x="${left}" y="12" font-size="11" class="b-mut">나온 차례</text><text x="${left}" y="${cellSize + 42}" font-size="11" class="b-mut">고른 ${data.ask === 'count' ? '개수' : '모양'}</text>`;
      items.forEach((item, i) => {
        const x = left + i * (cellSize + gap);
        body += `<rect x="${x}" y="18" width="${cellSize}" height="${cellSize}" rx="8" class="b-surf s-axis" stroke-width="1"/><g class="b-ink">${picture(item, x + cellSize / 2, 18 + cellSize / 2, cellSize)}</g>`;
        const slotTop = cellSize + 48, value = picked[i], right = value === answers[i];
        body += `<rect x="${x}" y="${slotTop}" width="${cellSize}" height="${cellSize}" rx="8" class="b-surf ${value == null ? 's-axis' : right ? 's-good' : 's-bad'}" stroke-width="${value == null ? 1 : 3}" ${value == null && answer ? 'stroke-dasharray="4 3"' : ''}/>`;
        if (value != null) body += valueOf(value, x + cellSize / 2, slotTop + cellSize / 2);
        if (answer && !right) body += data.ask === 'count' ? `<text x="${x + cellSize / 2}" y="${slotTop + cellSize + 14}" text-anchor="middle" font-size="11" class="f-good">${answers[i]}</text>` : `<g class="f-good">${glyph(answers[i], x + cellSize / 2, slotTop + cellSize + 10, 6)}</g>`;
      });
      return svg(width, cellSize * 2 + 70, body, '나온 차례와 고른 값');
    },

    // 조각 잇기: 왼쪽 벽 돌기 → 칸마다 놓은 조각 → 오른쪽 벽 홈. 아래는 단추 차례의 조각들
    chain(question, inputs, answer) {
      const data = question.data, pieces = data.pieces || [], shapes = data.shapes || [], pieceWidth = 58, pieceHeight = 38, gap = 6, pad = 8, wallWidth = 34;
      const shapeOf = (index) => shapes[index] || 'circle';
      const hole = (index, x, y) => `<g fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="3 2">${glyph(shapeOf(index), x, y, 9)}</g>`;
      const knob = (index, x, y) => `<g class="b-ink">${glyph(shapeOf(index), x, y, 9)}</g>`;
      const piece = (x, y, [holeIndex, knobIndex], faded) => `<g opacity="${faded ? 0.35 : 1}"><rect x="${x}" y="${y}" width="${pieceWidth}" height="${pieceHeight}" rx="7" class="b-surf s-axis" stroke-width="1.5"/>` +
        hole(holeIndex, x + 15, y + pieceHeight / 2) + knob(knobIndex, x + pieceWidth - 15, y + pieceHeight / 2) + '</g>';
      // 아래 설명 한 줄이 들어가도록 판을 넓히고, 벽과 칸 줄은 가운데에 둔다
      const trackWidth = wallWidth * 2 + pieces.length * (pieceWidth + gap) + gap, width = Math.max(trackWidth + pad * 2, 460);
      const trackLeft = (width - trackWidth) / 2, rowTop = 20, wallRight = trackLeft + trackWidth - wallWidth;
      let body = `<text x="${trackLeft}" y="12" font-size="11" class="b-mut">놓은 차례 (빈 모양 = 홈, 찬 모양 = 돌기)</text>`;
      body += `<rect x="${trackLeft}" y="${rowTop}" width="${wallWidth}" height="${pieceHeight}" rx="5" class="b-grid"/>${knob(data.start, trackLeft + wallWidth - 12, rowTop + pieceHeight / 2)}`;
      body += `<rect x="${wallRight}" y="${rowTop}" width="${wallWidth}" height="${pieceHeight}" rx="5" class="b-grid"/>${hole(data.finish, wallRight + 12, rowTop + pieceHeight / 2)}`;
      const placed = answer && answer.placed ? answer.placed : inputs.map((input) => input.piece);
      const deadAt = answer ? answer.deadAt : inputs.findIndex((input) => input.alive === false);
      pieces.forEach((_, slot) => {
        const x = trackLeft + wallWidth + gap + slot * (pieceWidth + gap);
        if (placed[slot] != null && pieces[placed[slot]]) body += piece(x, rowTop, pieces[placed[slot]], false) + `<text x="${x + pieceWidth / 2}" y="${rowTop + pieceHeight + 12}" text-anchor="middle" font-size="10" class="b-mut">단추 ${placed[slot] + 1}</text>`;
        else body += `<rect x="${x}" y="${rowTop}" width="${pieceWidth}" height="${pieceHeight}" rx="7" fill="none" class="s-axis" stroke-width="1" stroke-dasharray="4 3"/>`;
        if (deadAt != null && deadAt >= 0 && slot === deadAt) body += `<rect x="${x - 3}" y="${rowTop - 3}" width="${pieceWidth + 6}" height="${pieceHeight + 6}" rx="9" fill="none" class="s-bad" stroke-width="3"/>`;
      });
      const buttonsTop = rowTop + pieceHeight + 40, buttonsLeft = (width - (pieces.length * (pieceWidth + gap) - gap)) / 2;
      body += `<text x="${buttonsLeft}" y="${buttonsTop - 8}" font-size="11" class="b-mut">단추 (화면 차례)</text>`;
      pieces.forEach((pair, i) => (body += piece(buttonsLeft + i * (pieceWidth + gap), buttonsTop, pair, placed.includes(i)) + `<text x="${buttonsLeft + i * (pieceWidth + gap) + pieceWidth / 2}" y="${buttonsTop + pieceHeight + 12}" text-anchor="middle" font-size="10" class="b-mut">${i + 1}</text>`));
      const caption = [`정답 차례 ${data.sols ?? '?'}가지 · 함정 ${data.traps ?? '?'}개`, deadAt != null && deadAt >= 0 ? `${deadAt + 1}번째 칸부터 끝까지 이을 수 없음` : null, answer && answer.stuck ? '이을 조각이 없어 멈춤' : null].filter(Boolean).join(' · ');
      body += `<text x="${width / 2}" y="${buttonsTop + pieceHeight + 30}" text-anchor="middle" font-size="11" class="b-ink2">${escapeHtml(caption)}</text>`;
      return svg(width, buttonsTop + pieceHeight + 38, body, '놓은 조각과 단추');
    },

    // 같은 글자 넣기: 낱말마다 빈 글자 자리, 보기
    blank(question, inputs, answer) {
      const data = question.data, words = data.words || [], at = data.at || [], cellSize = 40, gap = 4, rowGap = 10, pad = 8;
      const longest = Math.max(2, ...words.map((word) => [...word].length)), width = Math.max(pad * 2 + longest * (cellSize + gap), optionRowWidth((data.opts || []).length), 280);
      const shown = answer ? answer.picked : null, right = shown === data.ans;
      let body = '';
      words.forEach((word, row) => {
        const syllables = [...word], left = (width - syllables.length * (cellSize + gap) + gap) / 2, y = pad + row * (cellSize + rowGap);
        syllables.forEach((syllable, i) => {
          const x = left + i * (cellSize + gap), center = `x="${x + cellSize / 2}" y="${y + cellSize / 2 + 7}" text-anchor="middle" font-size="20"`;
          if (i !== at[row]) { body += `<rect x="${x}" y="${y}" width="${cellSize}" height="${cellSize}" rx="6" class="b-surf s-axis" stroke-width="1"/><text ${center} font-weight="600" class="b-ink">${escapeHtml(syllable)}</text>`; return; }
          body += `<rect x="${x}" y="${y}" width="${cellSize}" height="${cellSize}" rx="6" class="b-grid ${shown == null ? 's-axis' : right ? 's-good' : 's-bad'}" stroke-width="${shown == null ? 1.5 : 3}" ${shown == null ? 'stroke-dasharray="4 3"' : ''}/>`;
          if (shown != null) body += `<text ${center} font-weight="700" class="${right ? 'f-good' : 'f-bad'}">${escapeHtml(shown)}</text>`;
          else if (answer) body += `<text ${center} font-weight="700" class="f-good" opacity="0.6">${escapeHtml(data.ans)}</text>`;
        });
      });
      const optionsTop = pad + words.length * (cellSize + rowGap) + 6;
      body += optionRow(data.opts || [], width, optionsTop, { right: data.ans, answer });
      return svg(width, optionsTop + 44, body, '낱말과 보기');
    },

    // 금고 열기: 암호 표(숫자 줄 · 단서 줄), 금고 문의 그림 줄과 자리마다 누른 숫자
    safe(question, inputs, answer) {
      const data = question.data, code = data.code || [], given = data.given || 0, known = data.known || [], hidden = data.hidden || {};
      const pad = 8, rowHeight = 30, slotSize = 40, gap = 6, tableWidth = 240, codeLeft = pad + tableWidth + 18, codeTop = 20;
      const values = { ...Object.fromEntries(known), ...hidden };
      const rows = [...known.map(([id, digit]) => [id, '=', digit]), ...(data.clues || [])];
      const isGlyph = (token) => typeof token === 'string' && SHAPES[token];
      let body = `<text x="${pad}" y="12" font-size="11" class="b-mut">암호 표</text>`;
      rows.forEach((tokens, row) => {
        let x = pad + 6; const y = 20 + row * rowHeight + rowHeight / 2;
        body += `<rect x="${pad}" y="${20 + row * rowHeight + 2}" width="${tableWidth}" height="${rowHeight - 4}" rx="5" class="${row < known.length ? 'b-surf' : 'b-grid'}"/>`;
        for (const token of tokens) {
          const tokenWidth = isGlyph(token) ? 22 : String(token).length * 9 + 8;
          body += isGlyph(token) ? `<g class="b-ink">${glyph(token, x + 10, y, 8)}</g>` : `<text x="${x + tokenWidth / 2}" y="${y + 5}" text-anchor="middle" font-size="14" font-weight="600" class="b-ink">${escapeHtml(token)}</text>`;
          x += tokenWidth;
        }
      });
      body += `<text x="${codeLeft}" y="12" font-size="11" class="b-mut">금고 문 (암호)</text>`;
      const typed = {};
      inputs.forEach((input) => (typed[input.slot] = { digit: input.digit, ok: input.ok }));
      if (answer) (answer.wrong || []).forEach(({ slot, tapped }) => (typed[slot] = { digit: tapped, ok: false }));
      code.forEach((id, slot) => {
        const x = codeLeft + slot * (slotSize + gap), entry = typed[slot], digitTop = codeTop + slotSize + 6;
        const center = `x="${x + slotSize / 2}" y="${digitTop + slotSize / 2 + 7}" text-anchor="middle" font-size="19" font-weight="700"`;
        body += `<rect x="${x}" y="${codeTop}" width="${slotSize}" height="${slotSize}" rx="6" class="b-surf s-axis" stroke-width="1"/><g class="b-ink">${glyph(id, x + slotSize / 2, codeTop + slotSize / 2, 11)}</g>`;
        if (slot < given) body += `<rect x="${x}" y="${digitTop}" width="${slotSize}" height="${slotSize}" rx="6" class="b-grid"/><text ${center} class="b-ink2">${values[id]}</text>`;
        else if (entry) {
          const late = entry.digit == null;
          body += `<rect x="${x}" y="${digitTop}" width="${slotSize}" height="${slotSize}" rx="6" class="b-surf ${entry.ok ? 's-good' : 's-bad'}" stroke-width="3"/><text ${center} class="${entry.ok ? 'f-good' : 'f-bad'}">${late ? '–' : entry.digit}</text>`;
          if (!entry.ok) body += `<text x="${x + slotSize / 2}" y="${digitTop + slotSize + 13}" text-anchor="middle" font-size="11" class="f-good">${values[id]}</text>`;
        } else body += `<rect x="${x}" y="${digitTop}" width="${slotSize}" height="${slotSize}" rx="6" fill="none" class="s-axis" stroke-width="1" stroke-dasharray="4 3"/>`;
      });
      const showHidden = answer && Object.keys(hidden).length, hiddenTop = codeTop + slotSize * 2 + 54;
      if (showHidden) {
        let x = codeLeft;
        body += `<text x="${x}" y="${hiddenTop - 14}" font-size="11" class="b-mut">단서로 알아낼 숫자</text>`;
        for (const [id, digit] of Object.entries(hidden)) { body += `<g class="b-ink">${glyph(id, x + 9, hiddenTop, 8)}</g><text x="${x + 20}" y="${hiddenTop + 5}" font-size="14" font-weight="600" class="b-ink">= ${digit}</text>`; x += 58; }
      }
      const width = Math.max(codeLeft + code.length * (slotSize + gap) + pad, 300);
      return svg(width, Math.max(20 + rows.length * rowHeight + pad, showHidden ? hiddenTop + 12 : codeTop + slotSize * 2 + 26), body, '암호 표와 누른 숫자');
    },

    // 그림 조각 기억하기: 그림 전체(물은 칸에 노란 테두리)와 보기 조각. 그림은 로그에 남긴 svg 를 칸만큼 잘라 그린다
    art(question, inputs, answer) {
      const data = question.data, [cols, rows] = data.grid || [2, 1], tile = 44, pad = 8, top = 18, gap = 28, choiceSize = 52, choiceGap = 10;
      const choices = data.choices || [], picture = data.picture || '';
      const place = (markup, x, y, size, viewBox) => markup.replace(/^<svg[^>]*>/, `<svg x="${x}" y="${y}" width="${size[0]}" height="${size[1]}" viewBox="${viewBox}" preserveAspectRatio="none">`);
      const tileBox = (index) => `${(index % cols) * 100} ${Math.floor(index / cols) * 100} 100 100`;
      const pictureWidth = cols * tile, pictureHeight = rows * tile, choicesLeft = pad + pictureWidth + gap;
      let body = `<text x="${pad}" y="12" font-size="11" class="b-mut">그림 (${data.nth || 1}번째 문제)</text><text x="${choicesLeft}" y="12" font-size="11" class="b-mut">보기</text>`;
      if (picture) body += place(picture, pad, top, [pictureWidth, pictureHeight], `0 0 ${cols * 100} ${rows * 100}`);
      const tx = pad + (data.target % cols) * tile, ty = top + Math.floor(data.target / cols) * tile;
      body += `<rect x="${tx + 1.5}" y="${ty + 1.5}" width="${tile - 3}" height="${tile - 3}" fill="none" stroke="#f2b928" stroke-width="3"/>`;
      choices.forEach((choice, i) => {
        const x = choicesLeft + i * (choiceSize + choiceGap), altered = String(choice).endsWith('*'), index = parseInt(choice, 10);
        const markup = altered ? data.alteredSvg || '' : picture;
        if (markup) body += place(markup, x, top, [choiceSize, choiceSize], tileBox(index));
        body += `<rect x="${x}" y="${top}" width="${choiceSize}" height="${choiceSize}" rx="4" fill="none" class="s-axis" stroke-width="1"/>`;
        if (altered) body += `<text x="${x + choiceSize / 2}" y="${top + choiceSize + 13}" text-anchor="middle" font-size="10" class="b-ink2">바꾼 조각</text>`;
        body += pickRing(x, top, choiceSize, choiceSize, answer, answer && String(answer.choice) === String(choice), !altered && index === data.target);
      });
      const width = Math.max(choicesLeft + choices.length * (choiceSize + choiceGap) + pad, 260);
      return svg(width, top + Math.max(pictureHeight, choiceSize + 16) + pad, body, '그림과 보기 조각');
    },
  };

  // ---------- 화면 ----------
  let model = null, playhead = 0, playing = false, speed = 4, currentQuestion = null;

  function load(log) {
    model = buildModel(log);
    $('#tl-sec').hidden = false;
    $('#stage').hidden = false;
    const meta = log.meta || {}, summary = meta.summary || {};
    const when = meta.startedAt ? new Date(meta.startedAt).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }) : '';
    const ended = { complete: '끝까지 함', user: '그만하기', operator: '운영자가 끝냄', idle: '자리 비움', abandoned: '중단' }[meta.ended] || meta.ended || '';
    $('#sess-meta').textContent = [when, meta.station ? `스테이션 ${meta.station}` : null, meta.participant ? `참가 ${meta.participant}` : null,
      meta.track === 'brain' ? '두뇌 게임만' : '페달 + 두뇌 게임', meta.input === 'pedal' ? '페달' : '키보드', ended, `로그 v${meta.version ?? '?'}`].filter(Boolean).join(' · ');

    const done = model.questions.filter((question) => question.answer);
    const inTime = done.filter((question) => !question.answer.timedOut && question.answer.ms != null);
    const average = (values) => (values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : null);
    const playSamples = model.samples.filter((sample) => sample.clock >= model.playStart && sample.target != null);
    const zone = playSamples.length ? Math.round((100 * playSamples.filter((sample) => sample.inZone).length) / playSamples.length) : null;
    const tile = (label, value, small = '', extra = '') => `<div class="tile"><div class="k">${label}</div><div class="v">${value}<small>${small}</small></div>${extra ? `<div class="x">${extra}</div>` : ''}</div>`;
    $('#tiles').innerHTML = [
      tile('총점', summary.score ?? '–', '', summary.exScore != null ? `운동 ${summary.exScore} · 인지 ${summary.cogScore}` : ''),
      tile('정답', `${done.filter((question) => question.answer.correct).length}/${done.length}`, '', done.some((question) => question.answer.timedOut) ? `시간 초과 ${done.filter((question) => question.answer.timedOut).length}번` : ''),
      tile('첫 입력까지 (평균)', inTime.length ? (average(inTime.map((question) => question.answer.first ?? question.answer.ms)) / 1000).toFixed(1) : '–', '초'),
      tile('답까지 (평균)', inTime.length ? (average(inTime.map((question) => question.answer.ms)) / 1000).toFixed(1) : '–', '초'),
      tile('초록 구역 안', zone == null ? '–' : zone, zone == null ? '' : '%'),
      tile('플레이 시간', summary.elapsedSec != null ? clockText(summary.elapsedSec * 1000, false) : clockText(model.end - model.playStart, false)),
    ].join('');

    $('#legend').innerHTML = model.order.map((id) => `<span><i style="background:${gameColor(id)}"></i>${escapeHtml(TITLES[id] || id)}</span>`).join('') +
      (model.brain ? '' : `<span><i style="background:var(--zone);outline:1px solid var(--zone-edge)"></i>목표 구역</span><span><i style="background:var(--series);height:2px"></i>RPM</span>`);

    $('#q-count').textContent = `${model.questions.length}개 · ${model.games.length}판`;
    $('#q-body').innerHTML = model.questions.map((question, i) => {
      const result = resultOf(question), answer = question.answer;
      return `<tr class="q-row" tabindex="0" data-i="${i}"><td>${question.number}</td><td><span class="sw" style="background:${gameColor(question.game)}"></span>${escapeHtml(TITLES[question.game] || question.game)}</td><td>${question.level}</td>
        <td><span class="dot ${result}"></span> ${RESULT[result]}</td><td>${answer ? seconds(answer.first) : '–'}</td><td>${answer ? seconds(answer.ms) : '–'}</td></tr>`;
    }).join('');
    const first = model.questions[0];
    seek(first && first.answer ? first.answer.clock : model.end / 3);
    drawTimeline();
    render();
  }

  // 타임라인 좌표
  const TIMELINE = { width: 1000, height: 196, left: 40, right: 12, band: [6, 26], chart: [40, 148], questionRow: [160, 172], axis: 190 };
  const timeX = (clock) => TIMELINE.left + (clock / Math.max(1, model.end)) * (TIMELINE.width - TIMELINE.left - TIMELINE.right);
  function drawTimeline() {
    const timeline = $('#tl');
    timeline.setAttribute('viewBox', `0 0 ${TIMELINE.width} ${TIMELINE.height}`);
    // 두뇌 게임만 한 판은 페달 기록이 없어(rpm 0, 목표 없음) RPM 그래프 대신 한 줄 안내만 둔다
    const brain = model.brain;
    const rpmSamples = model.samples.filter((sample) => sample.rpm != null);
    const rpmMax = Math.max(10, ...rpmSamples.map((sample) => sample.rpm), ...rpmSamples.filter((sample) => sample.target != null).map((sample) => sample.target * (1 + model.tolerance))) * 1.08;
    const rpmY = (rpm) => TIMELINE.chart[1] - (rpm / rpmMax) * (TIMELINE.chart[1] - TIMELINE.chart[0]);
    let body = '';
    // 눈금
    const step = model.end > 240000 ? 60000 : 30000;
    for (let clock = 0; clock <= model.end; clock += step) body += `<line x1="${timeX(clock)}" y1="${TIMELINE.chart[0] - 4}" x2="${timeX(clock)}" y2="${TIMELINE.questionRow[1]}" stroke="var(--grid)"/><text x="${timeX(clock)}" y="${TIMELINE.axis}" text-anchor="middle" class="lbl">${clockText(clock, false)}</text>`;
    if (brain) body += `<text x="${(TIMELINE.left + TIMELINE.width - TIMELINE.right) / 2}" y="${(TIMELINE.chart[0] + TIMELINE.chart[1]) / 2 + 4}" text-anchor="middle" class="lbl">두뇌 게임만 한 판 — 페달 기록 없음</text>`;
    else for (const rpm of [0, Math.round(rpmMax / 2 / 10) * 10]) body += `<text x="${TIMELINE.left - 6}" y="${rpmY(rpm) + 4}" text-anchor="end" class="lbl">${rpm}</text>`;
    if (!brain) body += `<text x="${TIMELINE.left - 6}" y="${TIMELINE.chart[0] + 2}" text-anchor="end" class="lbl">RPM</text>`;
    // 측정(두뇌 게임만이면 카운트다운) 구간. 이름은 들어갈 만큼 넓을 때만
    if (model.playStart > 0) {
      const width = timeX(model.playStart) - timeX(0);
      body += `<rect x="${timeX(0)}" y="${TIMELINE.band[0]}" width="${width}" height="${TIMELINE.band[1] - TIMELINE.band[0]}" rx="3" fill="var(--grid)"/>`;
      if (width > 36) body += `<text x="${timeX(0) + width / 2}" y="${TIMELINE.band[0] + 14}" text-anchor="middle" class="lbl-ink">${brain ? '준비' : '측정'}</text>`;
    }
    // 게임 띠 (소개 부분은 옅게)
    for (const round of model.games) {
