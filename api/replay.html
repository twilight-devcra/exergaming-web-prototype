      const startX = timeX(round.start), endX = timeX(round.end), openX = timeX(round.open ?? round.start), color = gameColor(round.game);
      body += `<rect x="${startX}" y="${TIMELINE.band[0]}" width="${Math.max(1, endX - startX - 1)}" height="${TIMELINE.band[1] - TIMELINE.band[0]}" rx="3" fill="${color}" opacity="0.35"/>`;
      body += `<rect x="${openX}" y="${TIMELINE.band[0]}" width="${Math.max(1, endX - openX - 1)}" height="${TIMELINE.band[1] - TIMELINE.band[0]}" rx="3" fill="${color}"/>`;
      const name = TITLES[round.game] || round.game;
      if (endX - openX > name.length * 11 + 8) body += `<text x="${openX + 6}" y="${TIMELINE.band[0] + 14}" class="band-lbl">${escapeHtml(name)}</text>`;
    }
    // 목표 구역 + RPM
    const zoneSamples = brain ? [] : rpmSamples.filter((sample) => sample.target != null);
    if (zoneSamples.length) {
      const upperEdge = zoneSamples.map((sample) => `${timeX(sample.clock).toFixed(1)},${rpmY(sample.target * (1 + model.tolerance)).toFixed(1)}`);
      const lowerEdge = zoneSamples.slice().reverse().map((sample) => `${timeX(sample.clock).toFixed(1)},${rpmY(sample.target * (1 - model.tolerance)).toFixed(1)}`);
      body += `<polygon points="${upperEdge.join(' ')} ${lowerEdge.join(' ')}" fill="var(--zone)" stroke="var(--zone-edge)" stroke-width="0.8"/>`;
      body += `<polyline points="${zoneSamples.map((sample) => `${timeX(sample.clock).toFixed(1)},${rpmY(sample.target).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--zone-edge)" stroke-dasharray="4 3"/>`;
    }
    if (!brain) body += `<polyline points="${rpmSamples.map((sample) => `${timeX(sample.clock).toFixed(1)},${rpmY(sample.rpm).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--series)" stroke-width="1.6" stroke-linejoin="round"/>`;
    for (const [pauseStart, pauseEnd] of model.pauses) body += `<rect x="${timeX(pauseStart)}" y="${TIMELINE.chart[0]}" width="${Math.max(2, timeX(pauseEnd) - timeX(pauseStart))}" height="${TIMELINE.chart[1] - TIMELINE.chart[0]}" fill="var(--axis)" opacity="0.5"/>`;
    // 문제: 입력이 열린 때 ~ 답, 점 색 = 결과
    const rowY = (TIMELINE.questionRow[0] + TIMELINE.questionRow[1]) / 2;
    body += `<text x="${TIMELINE.left - 6}" y="${rowY + 4}" text-anchor="end" class="lbl">문제</text>`;
    for (const question of model.questions) {
      const result = resultOf(question), endClock = question.answer ? question.answer.clock : question.round ? question.round.end : question.open;
      body += `<line x1="${timeX(question.open)}" y1="${rowY}" x2="${timeX(endClock)}" y2="${rowY}" stroke="var(--axis)" stroke-width="3" stroke-linecap="round"/>`;
      if (question.answer) body += `<circle cx="${timeX(endClock)}" cy="${rowY}" r="4.5" fill="var(--${result === 'wait' ? 'axis' : result})"/>`;
    }
    body += `<g id="ph"><line id="ph-line" y1="2" y2="${TIMELINE.questionRow[1] + 4}" stroke="var(--ink)" stroke-width="1.5"/><circle id="ph-dot" cy="2" r="4" fill="var(--ink)"/></g>`;
    timeline.innerHTML = body;
    placeHead();
  }
  function placeHead() {
    const x = timeX(playhead);
    const line = $('#ph-line'), dot = $('#ph-dot');
    if (line) { line.setAttribute('x1', x); line.setAttribute('x2', x); dot.setAttribute('cx', x); }
    $('#clock').textContent = clockText(playhead);
  }

  // 지금 시각의 문제: 지금 게임(소개가 끝난 뒤)의 마지막으로 열린 문제
  function current() {
    const round = model.games.find((candidate) => playhead >= candidate.start && playhead < candidate.end) || (playhead >= model.end ? model.games[model.games.length - 1] : null);
    if (!round) return { phase: playhead < model.playStart ? 'calib' : 'between' };
    if (round.open == null || playhead < round.open) return { phase: 'intro', round };
    const opened = round.questions.filter((question) => question.shownAt <= playhead);
    return opened.length ? { phase: 'question', round, question: opened[opened.length - 1] } : { phase: 'intro', round };
  }

  function render() {
    placeHead();
    const moment = current(), board = $('#board'), think = $('#think');
    const question = moment.question || null;
    document.querySelectorAll('.q-row').forEach((rowElement) => rowElement.classList.toggle('cur', question && model.questions[rowElement.dataset.i] === question));
    if (question !== currentQuestion) {
      currentQuestion = question;
      const row = question && document.querySelector(`.q-row[data-i="${model.questions.indexOf(question)}"]`);
      if (row && playing) row.scrollIntoView({ block: 'nearest' });
    }
    if (!question) {
      $('#b-title').textContent = moment.phase === 'calib' ? '속도 측정' : moment.round ? TITLES[moment.round.game] || moment.round.game : '–';
      $('#b-chip').innerHTML = '';
      $('#b-meta').textContent = moment.round ? `Lv${moment.round.level} · 게임 소개 화면` : moment.phase === 'calib' ? '기준 RPM을 재는 중' : '';
      board.innerHTML = `<div class="empty">${moment.phase === 'calib' ? '페달 속도를 재고 있어요' : moment.round ? '소개 화면 — 문제는 곧 나와요' : '게임 사이'}</div>`;
      think.innerHTML = '';
      return;
    }
    const inputs = question.inputs.filter((input) => input.clock <= playhead);
    const shown = question.answer && question.answer.clock <= playhead ? question.answer : null;
    const result = shown ? resultOf(question) : 'wait';
    $('#b-title').textContent = `${TITLES[question.game] || question.game}`;
    $('#b-chip').innerHTML = `<span class="chip ${result}">${RESULT[result]}</span>`;
    const nth = question.round ? `${question.round.questions.indexOf(question) + 1}/${question.round.questions.length}번째 문제` : '';
    $('#b-meta').textContent = [`Lv${question.level}`, nth, `세션 문제 #${question.number}`, question.open !== question.shownAt ? '지시를 띄운 뒤 입력이 열림' : null].filter(Boolean).join(' · ');
    const draw = DRAW[question.game];
    if (draw) {
      try { board.innerHTML = draw(question, inputs, shown); }
      catch (error) { board.innerHTML = `<div class="empty">그림을 그리지 못했어요 (${escapeHtml(error.message)})</div>`; }
    } else {
      const rest = { ...question.data }; // 시각·종류(t · clock · type)는 빼고 문제 내용만 보인다
      for (const key of ['t', 'clock', 'type']) delete rest[key];
      board.innerHTML = `<div class="empty">이 게임은 아직 그림이 없어요. 기록된 문제 내용:<pre>${escapeHtml(JSON.stringify(rest, null, 1))}</pre></div>`;
    }
    // 생각한 시간 막대: 입력이 열린 때 → 첫 입력 → 답, 제한 시간 표시
    const now = Math.max(0, playhead - question.open), answerMs = shown ? shown.ms : null, first = shown ? shown.first : (question.inputs.find((input) => input.clock <= playhead) || {}).ms;
    const full = Math.max(question.limit || 0, question.answer ? question.answer.ms || 0 : 0, now, 1000);
    const barWidth = 600, barX = (milliseconds) => (Math.min(milliseconds, full) / full) * barWidth;
    const live = answerMs ?? now;
    let body = `<rect x="0" y="6" width="${barWidth}" height="12" rx="6" fill="var(--grid)"/>`;
    if (first != null) body += `<rect x="0" y="6" width="${barX(first)}" height="12" rx="6" fill="var(--series)"/>`;
    body += `<rect x="${first != null ? barX(first) : 0}" y="6" width="${Math.max(0, barX(live) - (first != null ? barX(first) : 0))}" height="12" rx="6" fill="var(--series)" opacity="0.4"/>`;
    for (const input of inputs) body += `<line x1="${barX(input.ms)}" y1="3" x2="${barX(input.ms)}" y2="21" stroke="var(--ink)" stroke-width="1.5"/>`;
    if (question.limit) body += `<line x1="${barX(question.limit) - 1}" y1="0" x2="${barX(question.limit) - 1}" y2="24" stroke="var(--bad)" stroke-width="2"/><text x="${barX(question.limit) - 5}" y="32" text-anchor="end" class="lbl">제한 ${seconds(question.limit)}</text>`;
    think.innerHTML = `<div class="k"><span>생각한 시간 — 첫 입력까지 <b>${seconds(first)}</b> · 답까지 <b>${shown ? seconds(answerMs) : seconds(now) + '…'}</b></span><span>${inputs.length ? `입력 ${inputs.length}번` : ''}</span></div>
      <svg viewBox="0 0 ${barWidth} 34" preserveAspectRatio="none" aria-hidden="true">${body}</svg>`;
  }

  function seek(clock) { playhead = Math.max(0, Math.min(model.end, clock)); }

  // 재생
  let lastFrame = 0;
  function tick(now) {
    if (!playing) return;
    const elapsed = Math.min(100, now - lastFrame); lastFrame = now;
    seek(playhead + elapsed * speed);
    if (playhead >= model.end) setPlaying(false);
    render();
    requestAnimationFrame(tick);
  }
  function setPlaying(shouldPlay) {
    playing = shouldPlay;
    $('#play').textContent = shouldPlay ? '❚❚ 멈춤' : '▶ 재생';
    if (shouldPlay) { if (playhead >= model.end) seek(0); lastFrame = performance.now(); requestAnimationFrame(tick); }
  }
  $('#play').addEventListener('click', () => setPlaying(!playing));
  $('#speed').addEventListener('change', (event) => (speed = Number(event.target.value)));

  // 타임라인 끌기
  const timelineElement = $('#tl');
  const fromEvent = (event) => {
    const rect = timelineElement.getBoundingClientRect();
    const x = ((event.clientX - rect.left) / rect.width) * TIMELINE.width;
    return ((x - TIMELINE.left) / (TIMELINE.width - TIMELINE.left - TIMELINE.right)) * model.end;
  };
  let dragging = false;
  timelineElement.addEventListener('pointerdown', (event) => { dragging = true; timelineElement.setPointerCapture(event.pointerId); seek(fromEvent(event)); render(); });
  timelineElement.addEventListener('pointermove', (event) => { if (dragging) { seek(fromEvent(event)); render(); } });
  timelineElement.addEventListener('pointerup', () => (dragging = false));
  timelineElement.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') { seek(playhead + (event.key === 'ArrowRight' ? 1 : -1) * (event.shiftKey ? 10000 : 1000)); render(); event.preventDefault(); }
    if (event.key === ' ') { setPlaying(!playing); event.preventDefault(); }
  });
  // 목록에서 고르기: 그 문제의 답이 나온 순간으로 (답이 없으면 연 순간)
  const pickRow = (row) => { const question = model.questions[row.dataset.i]; setPlaying(false); seek(question.answer ? question.answer.clock : question.open + 1); render(); };
  $('#q-body').addEventListener('click', (event) => { const row = event.target.closest('.q-row'); if (row) pickRow(row); });
  $('#q-body').addEventListener('keydown', (event) => { const row = event.target.closest('.q-row'); if (row && (event.key === 'Enter' || event.key === ' ')) { pickRow(row); event.preventDefault(); } });

  // 파일 열기 (.json · .jsonl 첫 줄 · .json.gz)
  $('#file').addEventListener('change', async (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const message = $('#open-msg');
    try {
      let text;
      const head = new Uint8Array(await file.slice(0, 2).arrayBuffer());
      if (head[0] === 0x1f && head[1] === 0x8b) text = await new Response(file.stream().pipeThrough(new DecompressionStream('gzip'))).text();
      else text = await file.text();
      const line = text.trim().split('\n')[0];
      const log = JSON.parse(text.trim().startsWith('{') && text.trim().split('\n').length > 1 && file.name.endsWith('.jsonl') ? line : text);
      if (!log.events) throw new Error('events 가 없어요');
      setPlaying(false);
      load(log);
      message.textContent = `${file.name}${file.name.endsWith('.jsonl') ? ' (첫 세션)' : ''}`;
      message.className = '';
    } catch (error) {
      message.textContent = `열지 못했어요: ${error.message}. 세션 로그(.json, .json.gz, .jsonl)인지 확인하세요.`;
      message.className = 'err';
    }
  });

  // 관리 화면에서 열었으면 원본을 받아 온다 (같은 출처라 관리 화면 비밀번호가 그대로 쓰인다)
  const BASE = `${location.origin}/admin/`;
  $('#back').href = BASE;
  async function gunzipJSON(response) {
    const bytes = new Uint8Array(await response.arrayBuffer());
    const gzipped = bytes[0] === 0x1f && bytes[1] === 0x8b;
    const text = gzipped ? await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text() : new TextDecoder().decode(bytes);
    return JSON.parse(text);
  }
  (async () => {
    try {
      const options = await (await fetch(BASE + 'api/options', { cache: 'no-store' })).json();
      Object.assign(TITLES, options.titles || {});
    } catch { }
    const params = new URLSearchParams(location.search);
    const env = params.get('env'), device = params.get('device'), sid = params.get('sid');
    if (!device || !sid) return;
    $('#sess-meta').textContent = '불러오는 중…';
    try {
      const response = await fetch(`${BASE}raw/${encodeURIComponent(env || 'prod')}/${encodeURIComponent(device)}/${encodeURIComponent(sid)}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(response.status === 404 ? '원본이 없어요' : `서버 응답 ${response.status}`);
      const log = await gunzipJSON(response);
      if (!log.events) throw new Error('세션 로그 형식이 아니에요');
      load(log);
      document.title = `세션 재생 · ${device.slice(0, 8)} ${(log.meta && log.meta.startedAt || '').slice(0, 10)}`;
    } catch (error) {
      $('#sess-meta').innerHTML = `<span class="err">세션을 열지 못했어요: ${escapeHtml(error.message)}</span>`;
    }
  })();
})();
</script>
</body>
</html>
