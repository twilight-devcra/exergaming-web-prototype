<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>그림 조각 기억하기 · 만든 그림 모음</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; padding: 24px 32px 48px; background: #f3f1ea; font: 15px 'IBM Plex Sans KR', sans-serif; color: #222; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    .bar { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
    button, label { font: inherit; }
    button { padding: 6px 14px; border-radius: 8px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
    h2 { font-size: 16px; margin: 22px 0 10px; }
    .row { display: flex; flex-wrap: wrap; gap: 22px 26px; align-items: flex-start; }
    figure { margin: 0; }
    figcaption { font-size: 12px; color: #888; margin-top: 4px; }
    figcaption.bad { color: #c22; font-weight: 700; }
    .pic { --t: 62px; display: grid; grid-template-columns: repeat(var(--cols), var(--t)); grid-auto-rows: var(--t);
      border-radius: 4px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,.18); }
    .pic svg { display: block; width: 100%; height: 100%; }
    .split .pic { gap: 5px; overflow: visible; box-shadow: none; }
    .split .pic > div { border-radius: 3px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  </style>
</head>
<body>
<h1>그림 조각 기억하기 · 만든 그림 모음</h1>
<div class="bar">
  <button id="more">다른 그림</button>
  <label><input type="checkbox" id="split"> 조각으로 떼어 보기</label>
</div>
<main id="out"></main>
<script type="module">
// generate.js 의 그림을 칸 모양마다 8장씩 늘어놓는다. ?seed=N 으로 같은 묶음을 다시 볼 수 있다.
// shoot 용: ?split=1 이면 처음부터 떼어 본다.
import { makePicture } from './generate.js';
import { pictureSvg } from './board.js';

const GRIDS = [[2, 1, 'Lv1 · 1×2'], [2, 2, 'Lv2 · 2×2'], [3, 2, 'Lv3 · 2×3'], [3, 3, 'Lv4–6 · 3×3'], [4, 3, 'Lv7–8 · 3×4']];
const PER_ROW = 8;
const params = new URLSearchParams(location.search);
let base = Number(params.get('seed') || 1);
const out = document.getElementById('out');
const split = document.getElementById('split');
split.checked = params.get('split') === '1';

function render() {
  out.innerHTML = '';
  document.body.classList.toggle('split', split.checked);
  for (const [cols, rows, title] of GRIDS) {
    out.insertAdjacentHTML('beforeend', `<h2>${title}</h2>`);
    const row = document.createElement('div');
    row.className = 'row';
    for (let i = 0; i < PER_ROW; i++) {
      const seed = base + i;
      const pic = makePicture(cols, rows, seed);
      const figure = document.createElement('figure');
      const grid = document.createElement('div');
      grid.className = 'pic';
      grid.style.setProperty('--cols', cols);
      for (let t = 0; t < cols * rows; t++) grid.insertAdjacentHTML('beforeend', `<div>${pictureSvg(pic, t)}</div>`);
      figure.append(grid);
      figure.insertAdjacentHTML('beforeend', `<figcaption class="${pic.failed ? 'bad' : ''}">#${seed}${pic.failed ? ' 칸이 겹침' : ''}</figcaption>`);
      row.append(figure);
    }
    out.append(row);
  }
  window.GALLERY_READY = true;
}
document.getElementById('more').onclick = () => {
  base += PER_ROW;
  history.replaceState(null, '', `?seed=${base}`);
  render();
};
split.onchange = render;
render();
</script>
</body>
</html>
