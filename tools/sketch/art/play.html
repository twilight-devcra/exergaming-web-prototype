<!doctype html>
<html lang="ko" data-edition="app">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>그림 조각 기억하기 · 눌러 보기</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nunito:wght@700;800;900&display=swap">
  <link rel="stylesheet" href="../../../css/style.css">

  <link rel="stylesheet" href="../../../app/app.css">

  <link rel="stylesheet" href="art.css">
</head>
<body data-theme="scenic">
<script type="module">
// 그림 조각 기억하기 3단계: 진짜 게임과 같은 모양의 ArtGame(art-game.js)을 host 로 돌린다. 그림은 판마다 generate.js 가 새로 만든다.
// 아래 막대에서 레벨을 고른다. ?level=N 으로 시작 레벨, ?intro=0 이면 게임 소개를 건너뛴다, ?seed=N 이면 그림을 고정한다.
// 휴대폰(너비 600px 이하)에서는 휴대폰 배치.
import { Sketch } from '../sketch.js';
import { ArtGame } from './art-game.js';

Sketch.play(ArtGame);
</script>
</body>
</html>
