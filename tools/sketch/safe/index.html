<!doctype html>
<html lang="ko" data-edition="app">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>금고 열기 · 스케치</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nunito:wght@700;800;900&display=swap">
  <link rel="stylesheet" href="../../../css/style.css">
  <link rel="stylesheet" href="../../../css/themes.css">
  <link rel="stylesheet" href="../../../app/app.css">
  <link rel="stylesheet" href="../sketch.css">
  <link rel="stylesheet" href="safe.css">
</head>
<body data-theme="scenic">
<script type="module">
// 금고 열기 목업 (2단계, 2회차). 설계 카드: docs/games/drafts/safe.md. 판은 board.js 가 그리고, 여기에는 손으로 쓴 상태만 있다.
import { Sketch, Diagram } from '../sketch.js';
import { drawBoard, staticTimer, digitFor } from './board.js';

const TITLE = '금고 열기';

// 한 화면: 머리 줄 + 판. timer = 남은 시간 비율 (없으면 막대 없음)
const shot = (id, caption, state, { msg = '암호를 누르세요', kind = 'act', timer = null } = {}) => ({
  id, caption,
  render(stage) {
    const { body, message } = Sketch.frame(stage, `${TITLE} · Lv.${state.level}`, msg, kind);
    if (timer != null) staticTimer(message, timer);
    drawBoard(body, state);
  },
});
const filled = (state, count) => state.code.slice(0, count).map((id) => digitFor(state, id));

// ---------- 판 (세 배치가 같은 상태를 쓴다). 열쇠 표 줄 = [그림, 숫자, 식?] ----------
const LV1 = { level: 1, key: [['star', 4], ['circle', 7], ['triangle', 2]], code: ['triangle', 'star', 'circle'] };
const LV3 = { level: 3, key: [['heart', 8], ['square', 3], ['star', 6], ['circle', 1]], code: ['square', 'star', 'square', 'heart', 'circle'] };
const LV5 = { level: 5, key: [['moon', 5], ['plus', 9], ['triangle', 2], ['diamond', 4], ['heart', 7, ['moon', '+', 2]]], code: ['heart', 'moon', 'triangle', 'heart', 'plus'] };
const LV6 = { level: 6, key: [['star', 3], ['square', 8], ['circle', 1], ['moon', 5], ['triangle', 6, ['star', '×', 2]]], code: ['triangle', 'circle', 'square', 'triangle', 'moon'] };
const LV7 = { level: 7, key: [['diamond', 8], ['star', 5], ['heart', 3], ['square', 1], ['moon', 2, ['star', '−', 3]], ['circle', 9, ['diamond', '+', 1]]],
  code: ['circle', 'moon', 'diamond', 'circle', 'heart', 'star'] };
const LV8 = { level: 8, key: [['star', 2], ['heart', 1], ['plus', 6], ['circle', 7], ['square', 8, ['star', '+', 'plus']], ['triangle', 9, ['square', '+', 1]]],
  code: ['triangle', 'star', 'square', 'plus', 'triangle', 'heart'] };

const variants = (layout, prefix) => [
  shot(`${prefix}-lv1`, 'Lv1: 표 3칸, 암호 3자리. 첫 칸이 켜져 있다', { ...LV1, layout }, { timer: 0.9 }),
  shot(`${prefix}-lv3`, 'Lv3 (표준): 암호 5자리, 같은 그림이 되풀이된다. 두 자리를 넣은 뒤', { ...LV3, layout, typed: filled(LV3, 2), pressed: 6 }, { timer: 0.7 }),
  shot(`${prefix}-wrong`, '틀린 숫자: 누른 6 은 지우고 정답 3 을 넣은 채 다음 칸으로 넘어간다 (번호판에 정답 테두리)',
    { ...LV3, layout, typed: [3, 6, 3], wrong: [{ at: 2, tapped: 6 }], pressed: 6, answer: 3 }, { msg: '정답은 3', kind: 'bad', timer: 0.55 }),
  shot(`${prefix}-open`, '다 맞혔을 때: 자물쇠가 풀린 자물쇠로 바뀌고 초록', { ...LV3, layout, typed: filled(LV3, 5), result: 'open' }, { msg: '금고가 열렸어요!', kind: 'good' }),
  shot(`${prefix}-shut`, '한 칸이라도 틀렸을 때: 자물쇠가 빨강, 잠긴 채', { ...LV3, layout, typed: [3, 6, 3, 8, 1], wrong: [{ at: 2, tapped: 6 }], result: 'shut' }, { msg: '아쉬워요, 한 칸이 틀렸어요', kind: 'bad' }),
  shot(`${prefix}-lv5`, 'Lv5 식 하나: ♥ = ☾ + 2 → 7', { ...LV5, layout }, { timer: 0.95 }),
  shot(`${prefix}-lv6`, 'Lv6 곱하기: ▲ = ★ × 2 → 6', { ...LV6, layout }, { timer: 0.95 }),
  shot(`${prefix}-lv7`, 'Lv7 식 둘 (빼기 · 더하기), 각각 표에 있는 그림에서', { ...LV7, layout }, { timer: 0.95 }),
  shot(`${prefix}-lv8`, 'Lv8 이어진 식: ■ = ★ + ✚ (= 8), ▲ = ■ + 1 (= 9). 가장 빽빽한 판', { ...LV8, layout }, { timer: 0.95 }),
];

// ---------- 소개 그림 ----------
const glyph = (id, x, y, size) => Diagram.glyph(Sketch.symbol(id).svg, x, y, size);
// 표 한 줄: 그림 = 숫자, 또는 그림 = 식 (토큰: 그림 id 또는 글자)
const keyRow = (y, id, tokens, highlight) => {
  let x = 64;
  const parts = tokens.map((token) => {
    const drawn = Sketch.symbol(String(token)) ? glyph(token, x, y, 20) : Diagram.text(x, y, token, 19, tokens.length > 1 ? 'dg-txt num' : 'dg-txt');
    x += 24;
    return drawn;
  }).join('');
  return (highlight ? Diagram.rect(8, y - 14, 76 + tokens.length * 24, 28, 'dg-slot active', 6) : '') + glyph(id, 24, y, 20) + Diagram.text(44, y, '=', 16) + parts;
};
// 가운데 맞춘 한 줄 (그림 id 는 그림으로): 소개 그림의 '▲ = 4 + 2 = 6'. 글자 ▲ 는 색이 달라 그림과 헷갈리므로 그림을 쓴다
const eqLine = (y, tokens) => {
  const step = 17;
  let x = 88 - ((tokens.length - 1) * step) / 2;
  return tokens.map((token) => {
    const drawn = Sketch.symbol(String(token)) ? glyph(token, x, y, 18) : Diagram.text(x, y, token, 18, 'dg-txt num');
    x += step;
    return drawn;
  }).join('');
};
const windows = (ids, digits, y, active) => ids.map((id, i) => {
  const x = 30 + i * 42;
  return Diagram.rect(x, y, 34, 34, 'dg-cell', 7) + glyph(id, x + 17, y + 17, 24) +
    Diagram.rect(x, y + 40, 34, 30, i === active ? 'dg-slot active' : 'dg-slot', 6) + (digits[i] != null ? Diagram.text(x + 17, y + 55, digits[i], 20) : '');
}).join('');
const padRow = (y, tapAt) => [1, 2, 3, 4, 5, 6, 7, 8, 9].map((digit, i) => {
  const x = 7 + i * 18.4;
  return Diagram.rect(x, y, 16, 22, 'dg-cell', 4) + Diagram.text(x + 8, y + 11, digit, 13, digit === tapAt ? 'dg-txt num' : 'dg-txt') + (digit === tapAt ? Diagram.tap(x + 8, y + 11, 12) : '');
}).join('');

const STEP_PRESS = { svg: Diagram.svg('0 0 176 140', windows(['triangle', 'star', 'circle'], [2, 4], 4, 2) + padRow(104, 7)), caption: '차례대로 누르기' };
const INTROS = [
  { id: 'intro-lv1', caption: 'Lv1–4 소개', name: TITLE, hint: '그림마다 정해진 숫자를 표에서 찾아<br>금고 암호를 차례대로 누르세요',
    steps: [{ svg: Diagram.svg('0 0 176 140', keyRow(30, 'star', [4], true) + keyRow(62, 'circle', [7]) + keyRow(94, 'triangle', [2]) +
      Diagram.rect(118, 40, 46, 46, 'dg-slot active', 9) + glyph('star', 141, 63, 32) + Diagram.text(141, 110, '→ 4', 18, 'dg-txt num')), caption: '표에서 그림의 숫자 찾기' }, STEP_PRESS] },
  { id: 'intro-lv5', caption: 'Lv5 소개 (식이 처음 나올 때)', name: TITLE, tag: '레벨 업', hint: '숫자 대신 식이 있으면<br>계산해서 그 그림의 숫자를 구하세요',
    steps: [{ svg: Diagram.svg('0 0 176 140', keyRow(30, 'star', [4]) + keyRow(66, 'triangle', ['star', '+', 2], true) + eqLine(112, ['triangle', '=', 4, '+', 2, '=', 6])), caption: '식으로 숫자 구하기' }, STEP_PRESS] },
  { id: 'intro-lv8', caption: 'Lv8 소개 (식이 이어질 때)', name: TITLE, tag: '레벨 업', hint: '앞 줄에서 구한 숫자를<br>다음 식에 넣으세요',
    steps: [{ svg: Diagram.svg('0 0 176 140', keyRow(22, 'star', [2]) + keyRow(54, 'square', ['star', '+', 3], true) + keyRow(86, 'triangle', ['square', '+', 1], true) +
      eqLine(122, ['square', '=', 5, '→', 'triangle', '=', 6])), caption: '구한 숫자로 다음 식' }, STEP_PRESS] },
];

Sketch.page({
  title: '금고 열기 (safe) · 목업 2회차',
  notes: `<p>설계 카드: <code>docs/games/drafts/safe.md</code>. 1회차 의견: 단서(빈칸 · 쪽지)로 알아내기는 빼고 <b>식</b>(더하기 · 빼기 · 곱하기)으로 바꿈 · 번호판을 금고 문 아래에 둔 배치 C 를 더함 · 손잡이(✱) 대신 자물쇠.</p>
    <p>번호판은 이제 모든 배치에서 1–9. 표에 없는 숫자도 있어 '남는 숫자' 로 식을 건너뛸 수 없고, 미끼 숫자도 필요 없다. 화면 이름을 누르면 그 화면만 실제 창 크기로 열린다.</p>`,
  groups: [
    { title: 'C. 열쇠 표 | 금고 문 + 아래에 번호판 1–9 (새 안)', notes: 'A 처럼 표가 왼쪽, 번호판은 문 바로 아래 한 줄. 눈은 표 → 문, 손은 문 아래로.', shots: variants('below', 'c') },
    { title: 'A. 옆으로 놓기 — 열쇠 표 | 금고 문 | 번호판 3×3', shots: variants('door', 'a') },
    { title: 'B. 위아래로 놓기 — SDMT 식 가로 열쇠 줄, 식은 옆 상자', shots: variants('strip', 'b') },
    { title: '휴대폰 (세로 390×844) — 열쇠 표 · 금고 문 · 번호판 3×3', device: 'phone',
      notes: '판 자리가 좁고 길어(330×494) 태블릿 배치를 쓸 수 없다. 표는 세 칸씩 나눠 담고 식은 한 줄을 다 쓴다. 번호판은 전화 번호판 모양. 크기는 판 자리에 맞춰 함께 줄어든다.',
      shots: [
        ...variants('phone', 'p').filter((one) => /-(lv1|lv3|wrong|open|lv5|lv8)$/.test(one.id)),
        ...INTROS.filter((intro) => intro.id !== 'intro-lv8').map((intro) => ({ id: `p-${intro.id}`, caption: intro.caption, render: (stage) => Sketch.intro(stage, intro) })),
      ] },
    { title: '작은 휴대폰 (360×640) — 가장 좁은 경우', device: 'phone-small',
      notes: '판 자리가 300×339 라 같은 배치가 통째로 줄어든다. 단추가 56px 아래로 내려가는지 볼 것.',
      shots: [
        ...variants('phone', 's').filter((one) => /-(lv3|lv8)$/.test(one.id)),
        { id: 's-intro-lv5', caption: 'Lv5 소개', render: (stage) => Sketch.intro(stage, INTROS[1]) },
      ] },
    { title: '소개 화면', notes: 'diagram(level): 식이 처음 나오는 Lv5, 이어지는 Lv8 에서 ① 을 바꾼다.', shots: INTROS.map((intro) => ({ id: intro.id, caption: intro.caption, render: (stage) => Sketch.intro(stage, intro) })) },
  ],
});
</script>
</body>
</html>
