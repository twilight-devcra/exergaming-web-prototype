<!doctype html>
<html lang="ko" data-edition="app">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>금고 열기 · 스케치</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nunito:wght@700;800;900&display=swap">
  <link rel="stylesheet" href="../../../css/style.css">
  <link rel="stylesheet" href="../../../css/themes.css">
  <link rel="stylesheet" href="../../../app/app.css">
  <link rel="stylesheet" href="../sketch.css">
  <link rel="stylesheet" href="safe.css">
</head>
<body data-theme="scenic">
<script type="module">
// 금고 열기 목업 (2단계, 4회차). 설계 카드: docs/games/drafts/safe.md. 판은 board.js 가 그리고, 문제는 3단계와 같은 puzzles.js 를 쓴다.
// board.js 가 판마다 logic.js 로 단서의 답이 꼭 하나인지 확인한다 (어긋나면 경고). 눌러 보기는 play.html.
import { Sketch } from '../sketch.js';
import { drawBoard, staticTimer, digitFor } from './board.js';
import { LEVELS, PUZZLES } from './puzzles.js';
import { SafeGame } from './safe-game.js';

const TITLE = SafeGame.title;

// 한 화면: 머리 줄 + 판. timer = 남은 시간 비율 (없으면 막대 없음)
const shot = (id, caption, state, { msg = '암호를 누르세요', kind = 'act', timer = null } = {}) => ({
  id, caption,
  render(stage) {
    const { body, message } = Sketch.frame(stage, `${TITLE} · Lv.${state.level}`, msg, kind);
    if (timer != null) staticTimer(message, timer);
    drawBoard(body, state);
  },
});
// 레벨의 첫 문제. 처음부터 채워 둔 칸(given)이 있으면 채워서
const first = (level) => {
  const puzzle = PUZZLES[level][0];
  const given = LEVELS[level - 1].given || 0;
  return { ...puzzle, level, typed: puzzle.code.slice(0, given).map((id) => digitFor(puzzle, id)) };
};
const filled = (state, count) => state.code.slice(0, count).map((id) => digitFor(state, id));

const LV3 = first(3);
const variants = (layout, prefix) => [
  shot(`${prefix}-lv1`, 'Lv1: 표 3줄, 암호 3자리. 첫 칸은 처음부터 채워 두어 할 일을 말없이 보여 준다', { ...first(1), layout }, { timer: 0.9 }),
  shot(`${prefix}-lv3`, 'Lv3 (표준): 암호 5자리, 같은 그림이 되풀이된다. 두 자리를 넣은 뒤', { ...LV3, layout, typed: filled(LV3, 2), pressed: 6 }, { timer: 0.7 }),
  shot(`${prefix}-wrong`, '틀린 숫자: 누른 6 은 지우고 정답 3 을 넣은 채 다음 칸으로 (번호판에 정답 테두리)',
    { ...LV3, layout, typed: [3, 6, 3], wrong: [{ slot: 2, tapped: 6 }], pressed: 6, answer: 3 }, { msg: '정답은 3', kind: 'bad', timer: 0.55 }),
  shot(`${prefix}-open`, '다 맞혔을 때: 풀린 자물쇠, 초록', { ...LV3, layout, typed: filled(LV3, 5), result: 'open' }, { msg: '금고가 열렸어요!', kind: 'good' }),
  shot(`${prefix}-shut`, '한 칸이라도 틀렸을 때: 자물쇠가 빨강', { ...LV3, layout, typed: [3, 6, 3, 8, 1], wrong: [{ slot: 2, tapped: 6 }], result: 'shut' }, { msg: '아쉬워요, 1칸이 틀렸어요', kind: 'bad' }),
  shot(`${prefix}-lv5`, 'Lv5 식: ♥ = ☾ + 2 → 7', { ...first(5), layout }, { timer: 0.95 }),
  shot(`${prefix}-lv6`, 'Lv6 사이: ★ < ▲ < ☾ → 3 과 5 사이 = 4', { ...first(6), layout }, { timer: 0.95 }),
  shot(`${prefix}-lv7`, 'Lv7 (6줄): ☾ = ◆ + ■ → 9 · ● 는 5 와 8 사이의 짝수 → 6', { ...first(7), layout }, { timer: 0.95 }),
  shot(`${prefix}-lv8`, 'Lv8 (6줄): ▲ + ■ = 9, ▲ = ■ × 2 → ■ 3, ▲ 6 · ● 는 7 보다 큰 짝수 → 8', { ...first(8), layout }, { timer: 0.95 }),
];
const INTRO = { name: TITLE, steps: SafeGame.diagram(), hint: SafeGame.hint };
const introShot = (id) => ({ id, caption: '소개 (모든 레벨 같음). ② 의 숫자가 차례로 채워진다 (움직임은 눌러 보기 화면에서)', render: (stage) => Sketch.intro(stage, INTRO) });

Sketch.page({
  title: '금고 열기 (safe) · 목업 4회차',
  notes: `<p>설계 카드: <code>docs/games/drafts/safe.md</code>. <b>눌러 보기: <a href="play.html">play.html</a></b> (레벨마다 손으로 쓴 문제 3개).</p>
    <p>3회차 의견: 소개는 하나로 (② 에서 숫자가 차례로 채워짐) · 번호판에서 0 을 뺌 (휴대폰 2×5 의 마지막 칸은 빈칸) · 열쇠 표는 6줄까지 · Lv1 은 첫 칸을 채워 둔다.</p>`,
  groups: [
    { title: '태블릿 1280×800 — 배치 C', shots: [...variants('below', 'c'), introShot('intro')] },
    { title: '휴대폰 390×844', device: 'phone', notes: '판 자리 330×494.', shots: [...variants('phone', 'p').filter((one) => !one.id.endsWith('-shut')), introShot('p-intro')] },
    { title: '작은 휴대폰 360×640', device: 'phone-small', notes: '판 자리 300×339 라 같은 배치가 통째로 줄어든다.', shots: variants('phone', 's').filter((one) => /-(lv3|lv8)$/.test(one.id)) },
  ],
});
</script>
</body>
</html>
